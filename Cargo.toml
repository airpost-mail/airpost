[workspace]
resolver = "2"
members = [
    "apps/engine",
    "apps/backend",
    "apps/cli",
    "apps/gateway",
    "apps/mcp",
    "crates/*",
    "examples/service-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
# Every crate in the workspace (docs/backend-plan.md O6).
license = "GPL-3.0-only"
repository = "https://github.com/airpost-mail/airpost"
publish = false

[workspace.dependencies]
# Engine crates
airpost-core = { path = "crates/airpost-core" }
airpost-store = { path = "crates/airpost-store" }
airpost-providers = { path = "crates/airpost-providers" }
airpost-imap = { path = "crates/airpost-imap" }
airpost-mime = { path = "crates/airpost-mime" }
airpost-smtp = { path = "crates/airpost-smtp" }
airpost-net = { path = "crates/airpost-net" }
airpost-dav = { path = "crates/airpost-dav" }
airpost-pim = { path = "crates/airpost-pim" }
airpost-sync = { path = "crates/airpost-sync" }
airpost-tasks = { path = "crates/airpost-tasks" }
# Drafts as the desktop builds them: quoting, signatures, send warnings.
airpost-compose = { path = "crates/airpost-compose" }
# Shared with airpost-backend, which must not depend on the engine crates above.
airpost-wire = { path = "crates/airpost-wire" }
# The engine socket protocol: serde, serde_json and schemars only.
airpost-ipc = { path = "crates/airpost-ipc" }
# The client half of that protocol, for airpost, airpost-mcp and the gateway.
airpost-client = { path = "crates/airpost-client" }
# Socket activation and build ids, for airpost-gateway and airpost-mcp run by user units.
airpost-activation = { path = "crates/airpost-activation" }
# Third-party providers and model providers.
airpost-integrations = { path = "crates/airpost-integrations" }
airpost-ai = { path = "crates/airpost-ai" }
# The engine's secret store.
airpost-secrets = { path = "crates/airpost-secrets" }

# IMAP. airpost-imap has its own parser and command layer; async-imap and
# imap-proto are dev-dependencies of its spike example only.
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
imap-proto = "0.17"
tokio = { version = "1.53", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-platform-verifier = "0.7"
async-compression = { version = "0.4", features = ["tokio", "deflate"] }
futures = "0.3"

# MIME, SMTP, calendars and contacts
mail-parser = "0.11"
mail-builder = "1.0"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1", "tokio1-rustls", "ring", "rustls-platform-verifier"] }
calcard = "0.3"
encoding_rs = "0.8"
chardetng = "1.0"
html5ever = "0.40"
# Draft quoting (airpost-compose): the desktop's DOMPurify and juice passes.
ammonia = "4.2"
css-inline = { version = "0.23", default-features = false }
# Tracking transforms (airpost-compose): a streaming rewriter keeps the untouched markup as it was.
lol_html = "3"
idna = "1.1"
# Registered domains (the Public Suffix List), for the phishing warning on messages.
psl = "2.1"
roxmltree = "0.21"
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }

# Storage and networking
rusqlite = { version = "0.42", features = ["bundled", "hooks"] }
# rustls-no-provider: the bin installs ring as the process CryptoProvider. reqwest's "rustls"
# feature pulls aws-lc-rs, whose OpenSSL-licensed code is not GPL-compatible.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider", "form", "http2", "charset"] }

# Ids, encodings, time
sha2 = "0.11"
bs58 = "0.5"
base64 = "0.23"
md-5 = "0.11"
hmac = "0.13"
uuid = { version = "1.28", features = ["v4"] }
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
rand = "0.10"
hostname = "0.4"

# Secrets: AES-256-GCM for the file store, the macOS Keychain, the Linux Secret Service.
ring = "0.17"
# AES-256-CTR, only to read the obfuscated default Google client secret (airpost-providers).
aes = "0.8"
security-framework = "3"
# libdbus rather than zbus (no async runtime; secret-service 5 is on zbus 5, whose zvariant
# crates are unmaintained). `vendored` links libdbus statically (AFL-2.1 or GPL-2.0-or-later,
# NOTICE.md), so the engine runs where libdbus isn't installed and builds need no dbus headers.
dbus-secret-service = { version = "4.1", features = ["crypto-rust", "vendored"] }

# Logging, errors, serialization
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# JSON Schema for the airpost-ipc protocol types, from which packages/client is generated.
schemars = "1.2"
thiserror = "2.0"
bitflags = "2.13"
libc = "0.2"
# The airpost CLI (apps/cli).
clap = { version = "4.6", features = ["derive", "env"] }
# airpost-mcp (apps/mcp): the MCP SDK, and hyper for its optional streamable HTTP listener.
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
# Read-only checks of Codex's config.toml before airpost-mcp edits it.
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }

# Tests
regex = "1.13"
tempfile = "3.27"

[profile.release]
debug = 1

# dist builds the CLI's release binaries with this profile (dist-workspace.toml).
[profile.dist]
inherits = "release"
lto = "thin"
debug = 0

# airpost-backend: argon2 at default cost takes seconds unoptimized; its tests hash and verify
# passwords.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
