[workspace]
resolver = "2"
members = [
    "apps/engine",
    "apps/backend",
    "apps/cli",
    "apps/gateway",
    "apps/mcp",
    "crates/*",
    "examples/service-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
# Every crate in the workspace (docs/backend-plan.md O6).
license = "GPL-3.0-only"
repository = "https://github.com/ternmail/ternmail"
publish = false

[workspace.dependencies]
# Engine crates
ms-core = { path = "crates/ms-core" }
ms-store = { path = "crates/ms-store" }
ms-providers = { path = "crates/ms-providers" }
ms-imap = { path = "crates/ms-imap" }
ms-mime = { path = "crates/ms-mime" }
ms-smtp = { path = "crates/ms-smtp" }
ms-net = { path = "crates/ms-net" }
ms-dav = { path = "crates/ms-dav" }
ms-sync = { path = "crates/ms-sync" }
ms-tasks = { path = "crates/ms-tasks" }
# Drafts as the desktop builds them: quoting, signatures, send warnings (desktop-client-plan 3.3).
ms-compose = { path = "crates/ms-compose" }
# Shared with tern-backend, which must not depend on the engine crates above.
ms-wire = { path = "crates/ms-wire" }
# The engine socket protocol (docs/engine-protocol-plan.md): serde and serde_json only.
ms-ipc = { path = "crates/ms-ipc" }
# The client half of that protocol, for tern, tern-mcp and the gateway.
tern-client = { path = "crates/tern-client" }
# Third-party providers (docs/integrations-plan.md) and model providers (docs/ai-plan.md).
ms-integrations = { path = "crates/ms-integrations" }
ms-ai = { path = "crates/ms-ai" }
# The engine's secret store (docs/desktop-client-plan.md 3.6).
ms-secrets = { path = "crates/ms-secrets" }

# IMAP. ms-imap has its own parser and command layer (docs/spikes/imap.md); async-imap and
# imap-proto are dev-dependencies of its spike example only.
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
imap-proto = "0.17"
tokio = { version = "1.53", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-platform-verifier = "0.7"
async-compression = { version = "0.4", features = ["tokio", "deflate"] }
futures = "0.3"

# MIME, SMTP, calendars and contacts
mail-parser = "0.11"
mail-builder = "1.0"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1", "tokio1-rustls", "ring", "rustls-platform-verifier"] }
calcard = "0.3"
encoding_rs = "0.8"
chardetng = "1.0"
html5ever = "0.40"
# Draft quoting (ms-compose): the desktop's DOMPurify and juice passes.
ammonia = "4.2"
css-inline = { version = "0.23", default-features = false }
idna = "1.1"
roxmltree = "0.21"
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }

# Storage and networking
rusqlite = { version = "0.40", features = ["bundled"] }
# rustls-no-provider: the bin installs ring as the process CryptoProvider. reqwest's "rustls"
# feature pulls aws-lc-rs, whose OpenSSL-licensed code is not GPL-compatible.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider", "form", "http2", "charset"] }

# Ids, encodings, time
sha2 = "0.11"
bs58 = "0.5"
base64 = "0.23"
md-5 = "0.11"
hmac = "0.13"
uuid = { version = "1.28", features = ["v4"] }
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
rand = "0.10"
hostname = "0.4"

# Secrets: AES-256-GCM for the file store, the macOS Keychain, the Linux Secret Service.
ring = "0.17"
# AES-256-CTR, only to read the obfuscated default Google client secret (ms-providers).
aes = "0.8"
security-framework = "3"
# libdbus rather than zbus (no async runtime; secret-service 5 is on zbus 5, whose zvariant
# crates are unmaintained). `vendored` links libdbus statically (AFL-2.1 or GPL-2.0-or-later,
# NOTICE.md), so the engine runs where libdbus isn't installed and builds need no dbus headers.
dbus-secret-service = { version = "4.1", features = ["crypto-rust", "vendored"] }

# Logging, errors, serialization
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
bitflags = "2.13"
libc = "0.2"
# The tern CLI (apps/cli).
clap = { version = "4.6", features = ["derive", "env"] }
# tern-mcp (apps/mcp): the MCP SDK, and hyper for its optional streamable HTTP listener.
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
# Read-only checks of Codex's config.toml before tern-mcp edits it.
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }

# Tests
regex = "1.13"
tempfile = "3.27"

[profile.release]
debug = 1

# dist builds the CLI's release binaries with this profile (dist-workspace.toml).
[profile.dist]
inherits = "release"
lto = "thin"
debug = 0

# tern-backend: argon2 at default cost takes seconds unoptimized; its tests hash and verify
# passwords.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
