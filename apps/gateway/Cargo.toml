[package]
name = "tern-gateway"
description = "Authenticated remote access to a Tern engine for the web client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "tern-gateway"
path = "src/main.rs"

[dependencies]
tern-ipc.workspace = true
tern-client.workspace = true
futures.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tower-log", "ws"] }
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "macros", "net", "sync", "time", "io-util", "fs"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "fs"] }
governor = "0.10"
rand.workspace = true
sha2.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "ansi", "env-filter"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = "0.29"
http-body-util = "0.1"
tempfile.workspace = true
