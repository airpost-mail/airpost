[pytest]
# Every scenario starts its own server on a free port and its own engine with its own
# config dir, so cases run in parallel. `-n 0` runs serially; -v prints one line per case as
# it finishes, which is what a background run's log shows.
addopts = -n 16 -v
# The default run is the quick tier: cases without `slow`. `--slow` runs only the slow tier,
# `--all` both (conftest.py, README "Tiers").
markers =
    slow: slow tier (a Docker server, heavy seeding, or over ~20 s on its own); deselected by default
    docker(kind, ...): needs these Docker server kinds; implies slow, skipped when Docker is missing
