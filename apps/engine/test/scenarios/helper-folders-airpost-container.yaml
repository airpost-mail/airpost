name: helper-folders-tern-container
description: >
  An account with no container folder set and no Snoozed folder gets Tern/Snoozed, created
  with its Tern parent on the first sync, and the folder takes the snoozed role.
source: "background.rs container_components; roles.rs HELPER_FOLDER_PREFIXES"
servers:
  - {fake: dovecot}
account: {extra_settings: {create_helper_folders: true}}
mailboxes:
  INBOX: {messages: 1}
steps:
  - wait: quiescent
expect:
  folder_roles: {INBOX: inbox, Tern/Snoozed: snoozed}
  server_counts: {Tern/Snoozed: 0}
  log_present: ["Created required folder: Tern/Snoozed"]
  db_matches_server: {}
  running: true
