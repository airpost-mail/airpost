name: draft-push-basic
description: >
  With "Save drafts to server" on, a draft the client saves is APPENDed to Drafts once it
  has been left alone for the quiet window (2s here), flagged \Draft \Seen, with its Bcc,
  Message-ID and the X-Airpost-Draft marker, and its UID is recorded on the draft's row at
  once: the scan that then sees the copy finds it already placed, so the database agrees
  with the server and nothing flaps. The draft stays one row.
source: "RFC 4315 APPENDUID"
servers:
  - {fake: dovecot}
  - {dovecot: qresync}
  - {cyrus: fastmail}
account: {extra_settings: {save_drafts_to_server: true}}
env:
  AIRPOST_DRAFT_PUSH_QUIET: 2
mailboxes:
  INBOX: {messages: 3}
  Drafts: {messages: 0}
steps:
  - wait: quiescent
  - client.task:
      __cls: SyncbackDraftTask
      draft:
        hMsgId: "push-1@example.test"
        subject: "Plans for Friday"
        body: "<p>First version</p>"
        plaintext: false
        from: [{name: "Harness Test", email: "test@example.test"}]
        to: [{name: "Bob Builder", email: "bob@example.net"}]
        cc: []
        bcc: [{name: "Carol", email: "carol@example.net"}]
        replyTo: []
        files: []
        rthMsgId: ""
        fwdMsgId: ""
    as: save
  - wait: {task: save, timeout: 60}
  - wait: {log: "Saved draft push-1@example.test to Drafts UID \\d+", timeout: 60}
  - wait: {quiescent: true}
  - sync: pass
expect:
  server_has:
    Drafts:
      - {message_id: "push-1@example.test", flags: ["\\Draft", "\\Seen"],
         contains: ["Subject: Plans for Friday", "First version", "carol@example.net", "X-Airpost-Draft: 1"]}
  server_counts: {Drafts: 1, INBOX: 3}
  counts: {Drafts: 1, total: 4}
  db_matches_server: {flags: true}
  invariants: {}
  log_count: {"Saved draft push-1@example.test": 1}
  log_absent: ["\\[critical\\]", "Could not save draft", "UNIQUE constraint"]
  stable: {passes: 2}
  running: true
