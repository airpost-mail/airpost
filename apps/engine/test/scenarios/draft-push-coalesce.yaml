name: draft-push-coalesce
description: >
  The user keeps typing: three saves land within the quiet window (4s here). Only the
  last revision is uploaded, once, after the saves stop; a draft is not re-sent in full on
  every autosave.
source: "docs/drafts-sync-design.md 3.2 (quiet window) and risk 3 (every push re-uploads the full MIME)"
servers:
  - {fake: dovecot}
account: {extra_settings: {save_drafts_to_server: true}}
env:
  AIRPOST_DRAFT_PUSH_QUIET: 4
mailboxes:
  INBOX: {messages: 3}
  Drafts: {messages: 0}
steps:
  - wait: quiescent
  - client.task:
      __cls: SyncbackDraftTask
      draft:
        hMsgId: "push-1@example.test"
        subject: "Plans for Friday"
        body: "<p>Version 1</p>"
        plaintext: false
        from: [{name: "Harness Test", email: "test@example.test"}]
        to: [{name: "Bob Builder", email: "bob@example.net"}]
        cc: []
        bcc: []
        replyTo: []
        files: []
        rthMsgId: ""
        fwdMsgId: ""
    as: save1
  - wait: {task: save1, timeout: 60}
  - client.task:
      __cls: SyncbackDraftTask
      draft: {stored: "push-1@example.test", body: "<p>Version 2</p>"}
    as: save2
  - wait: {task: save2, timeout: 60}
  - client.task:
      __cls: SyncbackDraftTask
      draft: {stored: "push-1@example.test", body: "<p>Version 3</p>"}
    as: save3
  - wait: {task: save3, timeout: 60}
  - wait: {log: "Saved draft push-1@example.test to Drafts UID \\d+", timeout: 60}
  - wait: {seconds: 5}
  - wait: {quiescent: true}
expect:
  server_has:
    Drafts:
      - {message_id: "push-1@example.test", contains: ["Version 3"]}
  server_counts: {Drafts: 1}
  counts: {Drafts: 1}
  log_count: {"Saved draft push-1@example.test": 1}
  db_matches_server: {flags: true}
  log_absent: ["\\[critical\\]", "Could not save draft"]
  running: true
