ng appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. The long appendix. "}
    as: save2
  - wait: {task: save2, timeout: 60}
  - wait: {log: "attach-1@example.test is \\d+ bytes, over the server's APPENDLIMIT", timeout: 60}
  - wait: {seconds: 3}
  - wait: {quiescent: true}
expect:
  server_has:
    Drafts:
      - {message_id: "attach-1@example.test", contains: ['filename="notes.txt"', "YXR0YWNoZWQgdG8gdGhlIGRyYWZ0"], excludes: ["appendix.txt"]}
  server_counts: {Drafts: 1}
  counts: {Drafts: 1, total: 4}
  log_count: {"Saved draft attach-1@example.test": 1}
  db_matches_server: {flags: true}
  invariants: {}
  log_absent: ["\\[critical\\]", "Could not save draft", "UNIQUE constraint"]
  running: true
