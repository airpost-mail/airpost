name: import-legacy-without-legacy-db
description: >
  A new install has no C++ database, and the client still runs `--mode import-legacy`
  after migrate on every launch. With no tern.legacy.db it reports success, writes
  nothing (not even the record that an import ran, so a legacy database moved aside later
  is still imported), and sync starts as usual.
servers:
  - {fake: dovecot}
mailboxes:
  INBOX: {messages: 2}
import_legacy: true
steps:
  - wait: quiescent
expect:
  mode_output: {import-legacy: '"error":null'}
  counts: {INBOX: 2, total: 2}
  db_matches_server: {}
  config_files:
    absent: [tern.legacy.db, files.legacy]
  sql:
    - {db: main, query: "SELECT count(*) FROM _State WHERE id = 'legacy-import'", equals: 0}
    - {db: main, query: "SELECT count(*) FROM DetatchedPluginMetadata", equals: 0}
  log_absent: ["\\[critical\\]"]
  running: true
