# The backend's own check, on airpost-backend's graph only (docs/backend-plan.md 3.1):
#   cargo deny --manifest-path apps/backend/Cargo.toml check
# (cargo-deny picks this file, the nearest to the manifest.)
# airpost-backend is GPL-3.0-only like the rest of the workspace, so the licence list is the root
# one: GPLv3-compatible only. What this file adds is architectural: the server shares only
# airpost-wire with the engine and never depends on an engine crate (backend-plan 3.1).

[graph]
all-features = false
# Dev-dependencies never ship.
exclude-dev = true

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
unused-allowed-license = "allow"

[licenses.private]
# The workspace's own crates are GPL-3.0-only and unpublished. The engine crates are also
# private, so the bans below keep them out.
ignore = true

[bans]
multiple-versions = "allow"
# No TLS stack or HTTP client in the server (3.1, O5). aws-lc's OpenSSL-licensed code is not
# GPL-compatible.
deny = [
    { crate = "aws-lc-rs" },
    { crate = "aws-lc-sys" },
    { crate = "openssl-sys" },
    { crate = "openssl" },
    { crate = "native-tls" },
    { crate = "rustls" },
    { crate = "reqwest" },
    # The engine and its crates.
    { crate = "airpost-engine" },
    { crate = "airpost-core" },
    { crate = "airpost-store" },
    { crate = "airpost-providers" },
    { crate = "airpost-imap" },
    { crate = "airpost-mime" },
    { crate = "airpost-smtp" },
    { crate = "airpost-net" },
    { crate = "airpost-dav" },
    { crate = "airpost-sync" },
    { crate = "airpost-tasks" },
]

[advisories]
version = 2
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no safe upgrade" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
