# The backend's own check, on tern-backend's graph only (docs/backend-plan.md 3.1):
#   cargo deny --manifest-path apps/backend/Cargo.toml check
# (cargo-deny picks this file, the nearest to the manifest.)
# The root deny.toml covers the whole workspace with the GPL policy; this one adds what an MIT
# program needs: permissive licences only, and none of the GPL ms-* crates.

[graph]
all-features = false
# Dev-dependencies never ship.
exclude-dev = true

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
unused-allowed-license = "allow"

[licenses.private]
# tern-backend and ms-wire are MIT (backend-plan O6) and unpublished. The GPL workspace crates
# are also private, so the bans below keep them out.
ignore = true

[bans]
multiple-versions = "allow"
# No TLS stack or HTTP client in the server (3.1, O5). aws-lc's OpenSSL-licensed code is not
# GPL-compatible.
deny = [
    { crate = "aws-lc-rs" },
    { crate = "aws-lc-sys" },
    { crate = "openssl-sys" },
    { crate = "openssl" },
    { crate = "native-tls" },
    { crate = "rustls" },
    { crate = "reqwest" },
    # GPL-3.0-only workspace crates (Mailspring-derived).
    { crate = "mailsync" },
    { crate = "ms-core" },
    { crate = "ms-store" },
    { crate = "ms-providers" },
    { crate = "ms-imap" },
    { crate = "ms-mime" },
    { crate = "ms-smtp" },
    { crate = "ms-net" },
    { crate = "ms-dav" },
    { crate = "ms-sync" },
    { crate = "ms-tasks" },
]

[advisories]
version = 2
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
