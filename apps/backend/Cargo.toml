[package]
name = "tern-backend"
description = "Self-hostable Tern server: device tokens, metadata sync, tracking"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Written from scratch, GPL-3.0-only like the rest of the repo (docs/backend-plan.md O6). It
# shares only tern-wire with the engine and never depends on an engine crate; `deny.toml` here
# checks that and the licences of its dependencies.
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "tern-backend"
path = "src/main.rs"

[dependencies]
tern-wire.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "form", "tokio", "tower-log", "original-uri", "matched-path"] }
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "macros", "net", "sync", "time"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.7", features = ["cors", "trace", "limit"] }
http-body = "1.1"
rusqlite.workspace = true
argon2 = "0.6"
rand.workspace = true
sha2.workspace = true
base64.workspace = true
governor = "0.10"
# Already in the tree through tokio; for TCP keepalive and TCP_USER_TIMEOUT on accepted sockets.
socket2 = { version = "0.6", features = ["all"] }
maud = "0.27"
clap = { version = "4.6", features = ["derive", "env"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "ansi", "env-filter", "json"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "io-util"] }
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio", "service"] }
http-body-util = "0.1"
tempfile.workspace = true
