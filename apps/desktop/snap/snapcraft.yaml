# TODO: the snap name "airpost" may be taken in the Snap Store; register it (or pick another) before publishing.
name: airpost
license: GPL-3.0-only
adopt-info: airpost

confinement: strict
base: core24
compression: lzo

platforms:
  amd64:
  arm64:

parts:
  airpost:
    plugin: nil
    override-pull: |
      deb="$(ls $CRAFT_PROJECT_DIR/dist/airpost-*.deb)"
      craftctl set version="$(basename "$deb" | grep -Eo "[0-9]+.[0-9]+.[0-9]+")"
      dpkg -x "$deb" "$CRAFT_PART_SRC"
    override-build: |
      cp -a "$CRAFT_PART_SRC"/* "$CRAFT_PART_INSTALL"
      craftctl default
      sed -i 's|Icon=com.airpost.airpost|Icon=/usr/share/pixmaps/airpost\.png|' \
        $CRAFT_PART_INSTALL/usr/share/applications/com.airpost.airpost.desktop
      # GPLv3 6(d): the snap is published to the Store, so the source offer travels inside it.
      install -Dm644 "$CRAFT_PROJECT_DIR/dist/SOURCE.txt" \
        "$CRAFT_PART_INSTALL/usr/share/doc/airpost/SOURCE.txt"
    prime:
      - -usr/share/airpost/chrome-sandbox
    parse-info: [usr/share/metainfo/com.airpost.airpost.metainfo.xml]
    # The engine needs only glibc (TLS is rustls), so no mail or TLS libraries are staged.
    stage-packages:
      - libxkbfile1
      - ca-certificates
    stage:
      - -usr/lib/*/libsecret-*

  libsecret:
    source: https://gitlab.gnome.org/GNOME/libsecret.git
    source-depth: 1
    source-tag: '0.20.5'
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Dgtk_doc=false
      - -Dmanpage=false
      - -Dgcrypt=false
    # LGPL-2.1-or-later: the licence text and the complete source (section 6(a)) ship in the
    # snap, since the Store is not a place we can offer the source from.
    override-build: |
      craftctl default
      doc="$CRAFT_PART_INSTALL/usr/share/doc/libsecret"
      install -Dm644 "$CRAFT_PART_SRC/COPYING" "$doc/COPYING"
      tar -C "$CRAFT_PART_SRC" --exclude=.git -cJf "$doc/libsecret-0.20.5-source.tar.xz" .
    stage:
      - usr/lib/*/libsecret-*
      - usr/share/doc/libsecret/COPYING
      - usr/share/doc/libsecret/libsecret-0.20.5-source.tar.xz

apps:
  airpost:
    command: usr/bin/airpost --no-sandbox
    common-id: com.airpost.airpost
    desktop: usr/share/applications/com.airpost.airpost.desktop
    extensions: [gnome]
    environment:
      HOME: $SNAP_USER_COMMON
      # Correct the TMPDIR path for Chromium Framework/Electron to
      # ensure libappindicator has readable resources.
      TMPDIR: $XDG_RUNTIME_DIR
    plugs:
      - avahi-observe
      - browser-support
      - cups-control
      - opengl
      - home
      - desktop
      - desktop-legacy
      - network
      - network-bind
      - password-manager-service
      - pulseaudio
      - unity7
      - x11
      - wayland
