# cargo-about: THIRD-PARTY-NOTICES.txt for the Rust binaries (engine and backend). Generate with
# apps/engine/packaging/third-party-notices.sh, which also appends the crates' NOTICE files.
# The accepted list matches deny.toml.

accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Build dependencies stay in: proc macros and build scripts emit code into the binary.
ignore-dev-dependencies = true
# The workspace's own crates are covered by LICENSE.md and NOTICE.md.
private = { ignore = true }
workarounds = ["ring", "rustls", "chrono"]
