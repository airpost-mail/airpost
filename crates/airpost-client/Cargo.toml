[package]
name = "airpost-client"
description = "Client side of the engine socket: discovery, profile resolution, hello, the multi-engine router, typed calls and task builders"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Shared by airpost, airpost-mcp and later the gateway. No tokio,
# TLS or SQLite: it talks to running engines over their sockets only.
[dependencies]
iana-time-zone.workspace = true
airpost-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
