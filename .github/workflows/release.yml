name: release

# Builds Airpost's command-line release with scripts/ and distribution/: archives of airpost, airpost-engine, airpost-mcp
# and airpost-gateway plus the web client the gateway serves, for macOS (arm64, x86_64,
# universal; signed with the hardened runtime and notarized when the APPLE_* secrets are set)
# and Linux (x86_64, aarch64), the airpost-cli .deb and .rpm, and the Homebrew formula and AUR
# PKGBUILD rendered with the archives' checksums. A tag vX.Y.Z (matching Cargo.toml's
# workspace version) publishes them as a GitHub release with install.sh, SHA256SUMS,
# SOURCE.txt and a source archive with every crate vendored (GPLv3 section 6). Every archive and
# package holds LICENSE.md, NOTICE.md, the trademark notice and the third-party notices.
#
# `tap` then pushes the formula to airpost-mail/homebrew-tap's Formula/, except for prereleases.
# The PKGBUILD is attached, not pushed: publishing it waits until the AUR package exists (then copy
# it plus `makepkg --printsrcinfo > .SRCINFO` to the AUR repo).
#
# Secrets (all optional; without the APPLE_* ones the macOS binaries are signed ad hoc and not
# notarized, and without HOMEBREW_TAP_TOKEN the formula is attached but not pushed):
#   APPLE_CODESIGN_P12, APPLE_CODESIGN_KEY_PASSWORD  Developer ID Application certificate
#   APPLE_SIGNING_IDENTITY                           its name or SHA-1
#   APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER   notarytool API key, or
#   APPLE_ID, APPLE_ID_PASSWORD, APPLE_TEAM_ID             notarytool Apple ID
#   HOMEBREW_TAP_TOKEN                               contents: write on airpost-mail/homebrew-tap

on:
  workflow_dispatch:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

# Jobs get a read-only token unless they ask for more (only `release` does). Third-party
# actions are pinned to commits: the macOS job holds the Developer ID key in its keychain
# from the import step on, including during later steps' post-run hooks.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_ABOUT_VERSION: 0.9.2
  NFPM_VERSION: 2.43.0
  AIRPOST_REQUIRE_NOTICES: 1
  WHAT: "Airpost's command-line programs (airpost, airpost-engine, airpost-mcp, airpost-gateway) and web client"

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check the tag against Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
          [ "${GITHUB_REF_NAME#v}" = "$want" ] || { echo "tag $GITHUB_REF_NAME, Cargo.toml $want" >&2; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Build the web client
        run: scripts/build-web.sh "$RUNNER_TEMP/web"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web
          path: ${{ runner.temp }}/web

  macos:
    needs: web
    runs-on: macos-15
    env:
      HAVE_CERT: ${{ secrets.APPLE_CODESIGN_P12 != '' }}
      HAVE_NOTARY: ${{ secrets.APPLE_API_KEY_P8 != '' || secrets.APPLE_ID != '' }}
      TARGETS: aarch64-apple-darwin x86_64-apple-darwin universal-apple-darwin
    steps:
      - run: echo "DIST=$RUNNER_TEMP/dist" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-about
        run: cargo install --locked cargo-about --version "$CARGO_ABOUT_VERSION" --features cli

      - name: Build
        run: apps/engine/packaging/build-release.sh macos --gateway
        env:
          OUT_DIR: ${{ env.DIST }}

      - name: Import signing certificate
        if: env.HAVE_CERT == 'true'
        uses: apple-actions/import-codesign-certs@77ba2a2a8f5cfc8c405ebf3159f767c323e238f9 # v7.1.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CODESIGN_P12 }}
          p12-password: ${{ secrets.APPLE_CODESIGN_KEY_PASSWORD }}

      - name: Sign
        run: |
          [ "$HAVE_CERT" = true ] || export APPLE_SIGNING_IDENTITY=-
          for t in $TARGETS; do
            apps/engine/packaging/macos/sign.sh "$DIST/$t"/{airpost,airpost-engine,airpost-mcp,airpost-gateway}
          done
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      # A bare Mach-O can't be stapled: Gatekeeper looks the ticket up online the first time a
      # quarantined copy (a browser download) runs. curl, install.sh and Homebrew don't
      # quarantine, so unnotarized builds still run from those.
      - name: Notarize
        if: env.HAVE_CERT == 'true' && env.HAVE_NOTARY == 'true'
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/notary-key.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          fi
          bins=()
          for t in $TARGETS; do bins+=("$DIST/$t"/{airpost,airpost-engine,airpost-mcp,airpost-gateway}); done
          apps/engine/packaging/macos/notarize.sh "${bins[@]}"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Smoke test
        run: |
          for t in $TARGETS; do
            mkdir -p "$RUNNER_TEMP/config-$t"
            for b in airpost airpost-mcp airpost-gateway; do "$DIST/$t/$b" --version; done
            CONFIG_DIR_PATH="$RUNNER_TEMP/config-$t" "$DIST/$t/airpost-engine" --mode migrate
          done

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web
          path: ${{ runner.temp }}/web
      - name: Source offer
        run: .github/scripts/source-offer.sh --no-tag "$GITHUB_REF_NAME" "$RUNNER_TEMP/source" "$WHAT"
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Archive
        run: |
          src=()
          [ -f "$RUNNER_TEMP/source/SOURCE.txt" ] && src=(--source "$RUNNER_TEMP/source/SOURCE.txt")
          # shellcheck disable=SC2086
          scripts/archive.sh --dist "$DIST" --web "$RUNNER_TEMP/web" ${src[@]+"${src[@]}"} \
            --out "$RUNNER_TEMP/out" $TARGETS
          rm "$RUNNER_TEMP/out/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos
          path: ${{ runner.temp }}/out/*

  linux:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            deb_arch: amd64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            deb_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - run: echo "DIST=$RUNNER_TEMP/dist" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-about and nfpm
        run: |
          cargo install --locked cargo-about --version "$CARGO_ABOUT_VERSION" --features cli
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@v$NFPM_VERSION"

      - name: Build
        # On a native runner the script builds the runner's arch and skips the other.
        run: apps/engine/packaging/build-release.sh linux --gateway
        env:
          OUT_DIR: ${{ env.DIST }}

      - name: Smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/config"
          ldd "$DIST/${{ matrix.target }}/airpost-engine"
          for b in airpost airpost-mcp airpost-gateway; do "$DIST/${{ matrix.target }}/$b" --version; done
          CONFIG_DIR_PATH="$RUNNER_TEMP/config" "$DIST/${{ matrix.target }}/airpost-engine" --mode migrate

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web
          path: ${{ runner.temp }}/web
      - name: Source offer
        run: .github/scripts/source-offer.sh --no-tag "$GITHUB_REF_NAME" "$RUNNER_TEMP/source" "$WHAT"
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Archive
        run: |
          src=()
          [ -f "$RUNNER_TEMP/source/SOURCE.txt" ] && src=(--source "$RUNNER_TEMP/source/SOURCE.txt")
          scripts/archive.sh --dist "$DIST" --web "$RUNNER_TEMP/web" ${src[@]+"${src[@]}"} \
            --out "$RUNNER_TEMP/out" ${{ matrix.target }}
          rm "$RUNNER_TEMP/out/SHA256SUMS"
      - name: Packages
        run: |
          NFPM="$RUNNER_TEMP/bin/nfpm" distribution/linux/build-packages.sh "$RUNNER_TEMP/out" \
            "$RUNNER_TEMP/out/airpost-"*"-${{ matrix.target }}.tar.gz"
      - name: Install the .deb
        run: |
          sudo apt-get install -y "$RUNNER_TEMP/out/"airpost-cli_*_${{ matrix.deb_arch }}.deb
          airpost --version
          airpost-gateway --version
          test -f /usr/share/airpost-gateway/web/index.html
          sudo apt-get remove -y airpost-cli
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/out/*

  # The Corresponding Source of the binaries: the Cargo workspace and the web client at this
  # commit plus the exact crate sources Cargo.lock pins, so the release builds without
  # crates.io. The npm packages are pinned by apps/web/package-lock.json.
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92
      - name: Archive the source with vendored crates
        run: |
          name="airpost-${GITHUB_REF_NAME//\//-}-src"
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/archives"
          git archive --format=tar --prefix="$name/" HEAD -- Cargo.toml Cargo.lock \
            rust-toolchain.toml deny.toml LICENSE.md NOTICE.md \
            apps/engine apps/backend apps/cli apps/mcp apps/gateway apps/web crates \
            examples/service-plugin distribution scripts assets/brand/LICENSE.md \
            ':(exclude)apps/engine/test' |
            tar -x -C "$RUNNER_TEMP/src"
          cd "$RUNNER_TEMP/src/$name"
          mkdir -p .cargo
          cargo vendor --locked --versioned-dirs vendor > .cargo/config.toml
          cd ..
          tar -czf "$RUNNER_TEMP/archives/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-source
          path: ${{ runner.temp }}/archives/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: Source offer
        run: .github/scripts/source-offer.sh --no-tag "$GITHUB_REF_NAME" out "$WHAT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Checksums, formula and PKGBUILD
        run: |
          cp distribution/install.sh out/
          (cd out && sha256sum ./*.tar.gz ./*.deb ./*.rpm install.sh SOURCE.txt | sed 's| \./| |' > SHA256SUMS)
          cp distribution/homebrew/Formula/airpost.rb distribution/aur/PKGBUILD out/
          scripts/bump.sh "$GITHUB_REF_NAME" out/SHA256SUMS out/airpost.rb out/PKGBUILD
      - name: Publish
        run: |
          flags=(--latest)
          case "$GITHUB_REF_NAME" in *-*) flags=(--prerelease --latest=false) ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Airpost ${GITHUB_REF_NAME#v}" --generate-notes "${flags[@]}" out/*
        env:
          GH_TOKEN: ${{ github.token }}

  tap:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    concurrency: homebrew-tap
    env:
      HAVE_TAP: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - name: Skip without HOMEBREW_TAP_TOKEN
        if: env.HAVE_TAP != 'true'
        run: echo "::notice::HOMEBREW_TAP_TOKEN is not set, so Formula/airpost.rb was not pushed to airpost-mail/homebrew-tap"
      - name: Push Formula/airpost.rb to airpost-mail/homebrew-tap
        if: env.HAVE_TAP == 'true'
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern airpost.rb --dir "$RUNNER_TEMP"
          git clone "https://x-access-token:$TAP_TOKEN@github.com/airpost-mail/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          mkdir -p Formula
          cp "$RUNNER_TEMP/airpost.rb" Formula/airpost.rb
          git add Formula/airpost.rb
          if git diff --cached --quiet; then echo "Formula/airpost.rb is unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "airpost ${GITHUB_REF_NAME#v}"
          git push origin HEAD:main
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
