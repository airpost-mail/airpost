name: engine

on:
  push:
    branches: [main]
    paths: ["apps/engine/**", "apps/cli/**", "apps/gateway/**", "apps/mcp/**", "apps/backend/**", "examples/**", "crates/**", "Cargo.toml", "Cargo.lock", "deny.toml", "rust-toolchain.toml", "dist-workspace.toml", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["apps/engine/**", "apps/cli/**", "apps/gateway/**", "apps/mcp/**", "apps/backend/**", "examples/**", "crates/**", "Cargo.toml", "Cargo.lock", "deny.toml", "rust-toolchain.toml", "dist-workspace.toml", ".github/workflows/engine.yml"]

permissions:
  contents: read

# A new push to a PR cancels the run it supersedes; runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # No debuginfo: less to compile, link and cache; backtraces still name functions.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92
        with:
          components: rustfmt, clippy
      # rust-cache keys on the job id, which backend.yml and protocol.yml also call `check`;
      # without a key of its own this job restored their narrower cache and rebuilt ~335 crates.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: engine
          cache-on-failure: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # The harness's quick tier: fake servers only, no Docker (apps/engine/test/README.md).
  # One job builds the binaries, four shards run the cases.
  harness-build:
    runs-on: ubuntu-latest
    env:
      # Release semantics (no debug_assertions, same optimisation) without line tables.
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92
      # cache-on-failure: the job only fails on a compile error, and a cache saved only on
      # success was never saved while the harness kept failing.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: engine
          cache-on-failure: true
      # airpost, airpost-mcp, airpost-gateway and airpost-sample-service for test_cli.py, test_mcp.py,
      # test_gateway.py and test_service_plugin.py, which fail rather than skip without them
      # when CI is set.
      - run: cargo build --release --locked -p airpost-engine -p airpost -p airpost-mcp -p airpost-gateway -p airpost-sample-service
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-bin
          path: |
            target/release/airpost-engine
            target/release/airpost
            target/release/airpost-mcp
            target/release/airpost-gateway
            target/release/airpost-sample-service
          if-no-files-found: error
          retention-days: 1

  harness:
    needs: harness-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/engine/test/requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: harness-bin
          path: target/release
      # Artifacts drop the executable bit.
      - run: chmod +x target/release/*
      - run: pip install -r apps/engine/test/requirements.txt
      # -n 4 on a 4-vCPU runner: cases mostly wait on the engine and the fake server, so a
      # worker per vCPU keeps the runner busy (`-n auto` counted 2 physical cores).
      - run: python3 -m pytest apps/engine/test -n 4 --shard ${{ matrix.shard }}/4
        timeout-minutes: 20
        env:
          HARNESS_RUNS_DIR: ${{ runner.temp }}/harness-runs
          AIRPOST_ENGINE_BIN: ${{ github.workspace }}/target/release/airpost-engine
          AIRPOST_BIN: ${{ github.workspace }}/target/release/airpost
          AIRPOST_MCP_BIN: ${{ github.workspace }}/target/release/airpost-mcp
          AIRPOST_GATEWAY_BIN: ${{ github.workspace }}/target/release/airpost-gateway
          SAMPLE_SERVICE_BIN: ${{ github.workspace }}/target/release/airpost-sample-service
      # Kept only for failed and xfailed cases: engine log, database, server transcript.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: harness-runs-${{ matrix.shard }}
          path: ${{ runner.temp }}/harness-runs
          if-no-files-found: ignore
