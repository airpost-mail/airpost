name: engine

on:
  push:
    branches: [main]
    paths: ["apps/engine/**", "apps/cli/**", "skills/tern/**", "crates/**", "Cargo.toml", "Cargo.lock", "deny.toml", "rust-toolchain.toml", "dist-workspace.toml", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["apps/engine/**", "apps/cli/**", "skills/tern/**", "crates/**", "Cargo.toml", "Cargo.lock", "deny.toml", "rust-toolchain.toml", "dist-workspace.toml", ".github/workflows/engine.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # The harness's quick tier: fake servers only, no Docker (apps/engine/test/README.md).
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # tern, tern-mcp, tern-gateway and tern-sample-service for test_cli.py, test_mcp.py,
      # test_gateway.py and test_service_plugin.py, which fail rather than skip without them
      # when CI is set.
      - run: cargo build --release --locked -p tern-engine -p tern -p tern-mcp -p tern-gateway -p tern-sample-service
      - run: pip install -r apps/engine/test/requirements.txt
      # -n auto: the pytest.ini default of 16 workers oversubscribes a 4-core runner.
      - run: python3 -m pytest apps/engine/test -n auto
        timeout-minutes: 30
        env:
          HARNESS_RUNS_DIR: ${{ runner.temp }}/harness-runs
          TERN_BIN: ${{ github.workspace }}/target/release/tern
          TERN_MCP_BIN: ${{ github.workspace }}/target/release/tern-mcp
          TERN_GATEWAY_BIN: ${{ github.workspace }}/target/release/tern-gateway
          SAMPLE_SERVICE_BIN: ${{ github.workspace }}/target/release/tern-sample-service
      # Kept only for failed and xfailed cases: engine log, database, server transcript.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: harness-runs
          path: ${{ runner.temp }}/harness-runs
          if-no-files-found: ignore

  # No Windows builds until parity, but the code must keep compiling there.
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --all-targets --locked --target x86_64-pc-windows-msvc
