name: engine

on:
  push:
    branches: [main]
    paths: ["apps/engine/**", "apps/cli/**", "crates/**", "Cargo.toml", "Cargo.lock", "deny.toml", "rust-toolchain.toml", "dist-workspace.toml", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["apps/engine/**", "apps/cli/**", "crates/**", "Cargo.toml", "Cargo.lock", "deny.toml", "rust-toolchain.toml", "dist-workspace.toml", ".github/workflows/engine.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # The harness's quick tier: fake servers only, no Docker (apps/engine/test/README.md).
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # tern for test_cli.py and tern-gateway for test_gateway.py, which fail rather than skip
      # without them when CI is set.
      - run: cargo build --release --locked -p mailsync -p tern -p tern-gateway
      - run: pip install -r apps/engine/test/requirements.txt
      # -n auto: the pytest.ini default of 16 workers oversubscribes a 4-core runner.
      - run: python3 -m pytest apps/engine/test -n auto
        timeout-minutes: 30
        env:
          HARNESS_RUNS_DIR: ${{ runner.temp }}/harness-runs
          TERN_BIN: ${{ github.workspace }}/target/release/tern
          TERN_GATEWAY_BIN: ${{ github.workspace }}/target/release/tern-gateway
      # Kept only for failed and xfailed cases: engine log, database, server transcript.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: harness-runs
          path: ${{ runner.temp }}/harness-runs
          if-no-files-found: ignore

  # No Windows builds until parity (plan section 11), but the code must keep compiling there.
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked --target x86_64-pc-windows-msvc
