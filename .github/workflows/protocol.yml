name: protocol

# The engine protocol's generated files are current: packages/client/schema/airpost-ipc.json and
# crates/airpost-store/src/model_query_allowlist.json against crates/airpost-ipc, and
# packages/client/src/protocol against the schema (packages/client/README.md), and the package's
# typecheck and specs.

on:
  push:
    branches: [main]
    paths: ["crates/airpost-ipc/**", "crates/airpost-store/src/model_query_allowlist.json", "packages/client/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".github/workflows/protocol.yml"]
  pull_request:
    paths: ["crates/airpost-ipc/**", "crates/airpost-store/src/model_query_allowlist.json", "packages/client/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".github/workflows/protocol.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92
      # Its own key: rust-cache keys on the job id, and engine.yml's job is also `check`.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: protocol
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: packages/client/package-lock.json
      - run: npm ci
        working-directory: packages/client
      - run: cargo run --locked -q -p airpost-ipc --bin airpost-ipc-schema -- --check
      - run: node scripts/generate.mjs --check
        working-directory: packages/client
      - run: npm run typecheck
        working-directory: packages/client
      - run: npm test
        working-directory: packages/client
