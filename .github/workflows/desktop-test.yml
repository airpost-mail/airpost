name: desktop-test

# Lint, typecheck and the Jasmine specs for apps/desktop, with the Rust engine built and
# installed as apps/desktop/tern-engine. The app runs `tern-engine --mode migrate` before
# loading any spec; without an engine (or with one that refuses to start) it quits with status 0
# having run nothing, so the spec step also fails when the runner reports no passing specs.

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/engine/**"
      - "apps/mcp/**"
      - "apps/cli/**"
      - "crates/**"
      - "packages/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/scripts/check-npm-licenses.mjs"
      - ".github/workflows/desktop-test.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/engine/**"
      - "apps/mcp/**"
      - "apps/cli/**"
      - "crates/**"
      - "packages/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/scripts/check-npm-licenses.mjs"
      - ".github/workflows/desktop-test.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            xvfb \
            dbus-x11 \
            libgbm1 \
            libnss3 \
            libasound2t64 \
            libatk1.0-0t64 \
            libatk-bridge2.0-0t64 \
            libgtk-3-0t64

      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Release builds only start from a path containing "tern"; the checkout
      # path (/home/runner/work/ternmail/ternmail/...) satisfies that. A fork under another name
      # gets an engine that exits at once, which the zero-spec check below reports.
      - name: Build and install the Rust engine
        run: ../engine/packaging/build-release.sh linux --install-desktop

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # GPL-3.0-compatible licences only, as deny.toml does for the crates.
      - name: Check npm licences
        run: node ../../.github/scripts/check-npm-licenses.mjs .

      - name: Run lint
        run: npm run lint:check

      - name: Run Typecheck
        run: npm run typecheck

      # Ubuntu 23.10+ restricts unprivileged user namespaces through AppArmor, so
      # Electron cannot use its namespace sandbox and falls back to the SUID helper,
      # which is not setuid root inside node_modules. Re-allow the namespace sandbox
      # rather than passing --no-sandbox, so the tests run the way the app ships.
      - name: Allow Electron's namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run tests
        timeout-minutes: 20
        run: |
          dbus-launch --exit-with-session xvfb-run -a npm test 2>&1 | tee "$RUNNER_TEMP/specs.log"
          if ! grep -Eq '^ +[1-9][0-9]* passing' "$RUNNER_TEMP/specs.log"; then
            echo "::error::The spec runner reported no passing specs"
            exit 1
          fi
