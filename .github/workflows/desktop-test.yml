name: desktop-test

# Lint, typecheck and the Jasmine specs for apps/desktop, with the Rust engine built and
# installed as app/mailsync-rs. The app runs `mailsync-rs --mode migrate` before loading any
# spec; without an engine (or with one that refuses to start) it quits with status 0 having
# run nothing, so the spec step also fails when the runner reports no passing specs.

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/engine/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/desktop-test.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/engine/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/desktop-test.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            xvfb \
            dbus-x11 \
            libgbm1 \
            libnss3 \
            libasound2t64 \
            libatk1.0-0t64 \
            libatk-bridge2.0-0t64 \
            libgtk-3-0t64

      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2

      # Release builds only start from a path containing "tern" or "mailspring"; the checkout
      # path (/home/runner/work/ternmail/ternmail/...) satisfies that. A fork under another name
      # gets an engine that exits at once, which the zero-spec check below reports.
      - name: Build and install the Rust engine
        run: ../engine/packaging/build-release.sh linux --install-desktop

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/desktop/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint:check

      - name: Run Typecheck
        run: npm run typecheck

      # Ubuntu 23.10+ restricts unprivileged user namespaces through AppArmor, so
      # Electron cannot use its namespace sandbox and falls back to the SUID helper,
      # which is not setuid root inside node_modules. Re-allow the namespace sandbox
      # rather than passing --no-sandbox, so the tests run the way the app ships.
      - name: Allow Electron's namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run tests
        timeout-minutes: 20
        run: |
          dbus-launch --exit-with-session xvfb-run -a npm test 2>&1 | tee "$RUNNER_TEMP/specs.log"
          if ! grep -Eq '^ +[1-9][0-9]* passing' "$RUNNER_TEMP/specs.log"; then
            echo "::error::The spec runner reported no passing specs"
            exit 1
          fi
