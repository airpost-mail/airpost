name: backend

# apps/backend is its own Cargo workspace (own Cargo.lock and deny.toml) until it joins the
# root one (docs/backend-plan.md 3.1), so engine.yml's workspace jobs do not cover it.

on:
  push:
    branches: [main]
    paths: ["apps/backend/**", "rust-toolchain.toml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["apps/backend/**", "rust-toolchain.toml", ".github/workflows/backend.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/backend
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: apps/backend/Cargo.toml
          command: check
