name: backend

# airpost-backend is a member of the root workspace (engine.yml's workspace jobs build and test
# it too). This workflow runs its own checks fast, cargo deny on its graph alone with
# apps/backend/deny.toml (GPLv3-compatible licences, no engine crates), and builds the image,
# which carries LICENSE.md, NOTICE.md, SOURCE.txt and the crates' THIRD-PARTY-NOTICES.txt.
# This image is untagged and not published; a publishing job must pass SOURCE_URL, SOURCE_TAG
# and SOURCE_REVISION (see the Dockerfile).

on:
  push:
    branches: [main]
    paths: ["apps/backend/**", "crates/airpost-wire/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "about.toml", "about.hbs", "apps/engine/packaging/third-party-notices.sh", "deploy/backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["apps/backend/**", "crates/airpost-wire/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "about.toml", "about.hbs", "apps/engine/packaging/third-party-notices.sh", "deploy/backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92
        with:
          components: rustfmt, clippy
      # Its own key: rust-cache keys on the job id, and engine.yml's job is also `check`.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: backend
      - run: cargo fmt --all --check
      - run: cargo clippy -p airpost-backend -p airpost-wire --all-targets --locked -- -D warnings
      - run: cargo test -p airpost-backend -p airpost-wire --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: apps/backend/Cargo.toml
          command: check

  # Building the image runs third-party-notices.sh, which fails on a crate whose licence
  # cargo-about cannot identify.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the image
        run: docker build -f apps/backend/Dockerfile -t airpost-backend -t airpost-backend:ci .
      - name: Check the shipped notices
        run: |
          id="$(docker create airpost-backend)"
          docker cp "$id:/usr/share/doc/airpost-backend" "$RUNNER_TEMP/doc"
          docker rm "$id"
          ls -l "$RUNNER_TEMP/doc"
          test -s "$RUNNER_TEMP/doc/LICENSE.md"
          test -s "$RUNNER_TEMP/doc/NOTICE.md"
          grep -q '^NOTICE files' "$RUNNER_TEMP/doc/THIRD-PARTY-NOTICES.txt"
          test -s "$RUNNER_TEMP/doc/SOURCE.txt"
      # deploy/backend as a self-hoster runs it, with the image just built: the backend turns
      # healthy, Caddy serves it over TLS (its internal CA for localhost), backups are written.
      - name: Compose smoke test
        working-directory: deploy/backend
        env:
          AIRPOST_DOMAIN: localhost
          AIRPOST_VERSION: ci
        run: |
          c() { docker compose -f compose.yaml -f compose.build.yaml "$@"; }
          c config -q
          c up -d --no-build --wait --wait-timeout 120 || { c logs; exit 1; }
          curl -fsk https://localhost/ping
          curl -fsk https://localhost/airpost/v1/server | grep -q '"apiVersion":1'
          c exec backend airpost-backend user add ci@example.com > /dev/null
          c logs backend | grep -q 'backup written'
          name="$(c cp backend:/backups - | tar -t | grep -m1 -E '^backups/airpost-[0-9T]+Z\.db$' | cut -d/ -f2)"
          test -n "$name"
          c stop backend
          c run --rm backend restore "/backups/$name"
          c up -d --no-build --wait --wait-timeout 60
          curl -fsk https://localhost/ping
          c down -v
