name: backend

# tern-backend is a member of the root workspace (engine.yml's workspace jobs build and test
# it too). This workflow runs its own checks fast, cargo deny on its graph alone with
# apps/backend/deny.toml (GPLv3-compatible licences, no engine crates), and builds the image,
# which carries LICENSE.md, NOTICE.md, SOURCE.txt and the crates' THIRD-PARTY-NOTICES.txt.
# This image is untagged and not published; a publishing job must pass SOURCE_URL, SOURCE_TAG
# and SOURCE_REVISION (see the Dockerfile).

on:
  push:
    branches: [main]
    paths: ["apps/backend/**", "crates/ms-wire/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "about.toml", "about.hbs", "apps/engine/packaging/third-party-notices.sh", "deploy/backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["apps/backend/**", "crates/ms-wire/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "about.toml", "about.hbs", "apps/engine/packaging/third-party-notices.sh", "deploy/backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p tern-backend -p ms-wire --all-targets --locked -- -D warnings
      - run: cargo test -p tern-backend -p ms-wire --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: apps/backend/Cargo.toml
          command: check

  # Building the image runs third-party-notices.sh, which fails on a crate whose licence
  # cargo-about cannot identify.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f apps/backend/Dockerfile -t tern-backend -t tern-backend:ci .
      - name: Check the shipped notices
        run: |
          id="$(docker create tern-backend)"
          docker cp "$id:/usr/share/doc/tern-backend" "$RUNNER_TEMP/doc"
          docker rm "$id"
          ls -l "$RUNNER_TEMP/doc"
          test -s "$RUNNER_TEMP/doc/LICENSE.md"
          test -s "$RUNNER_TEMP/doc/NOTICE.md"
          grep -q '^NOTICE files' "$RUNNER_TEMP/doc/THIRD-PARTY-NOTICES.txt"
          test -s "$RUNNER_TEMP/doc/SOURCE.txt"
      # deploy/backend as a self-hoster runs it, with the image just built: the backend turns
      # healthy, Caddy serves it over TLS (its internal CA for localhost), backups are written.
      - name: Compose smoke test
        working-directory: deploy/backend
        env:
          TERN_DOMAIN: localhost
          TERN_VERSION: ci
        run: |
          c() { docker compose -f compose.yaml -f compose.build.yaml "$@"; }
          c config -q
          c up -d --no-build --wait --wait-timeout 120 || { c logs; exit 1; }
          curl -fsk https://localhost/ping
          curl -fsk https://localhost/tern/v1/server | grep -q '"apiVersion":1'
          c exec backend tern-backend user add ci@example.com > /dev/null
          c logs backend | grep -q 'backup written'
          name="$(c cp backend:/backups - | tar -t | grep -m1 -E '^backups/tern-[0-9T]+Z\.db$' | cut -d/ -f2)"
          test -n "$name"
          c stop backend
          c run --rm backend restore "/backups/$name"
          c up -d --no-build --wait --wait-timeout 60
          curl -fsk https://localhost/ping
          c down -v
