name: backend

# tern-backend is a member of the root workspace (engine.yml's workspace jobs build and test
# it too). This workflow runs its own checks fast, and cargo deny on its graph alone with
# apps/backend/deny.toml: permissive licences only and none of the GPL ms-* crates.

on:
  push:
    branches: [main]
    paths: ["apps/backend/**", "crates/ms-wire/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["apps/backend/**", "crates/ms-wire/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".github/workflows/backend.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p tern-backend -p ms-wire --all-targets --locked -- -D warnings
      - run: cargo test -p tern-backend -p ms-wire --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: apps/backend/Cargo.toml
          command: check
