name: desktop-build-linux-arm64

# Builds the arm64 .deb and .rpm with the Rust engine (apps/desktop/airpost-engine), builds the snap from
# the .deb, and installs the packages on several distros. Run by hand on main, or by
# desktop-release.yml for a desktop-vX.Y.Z tag on main.
#
# Secrets (all optional): AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY with the
# BUILDS_S3_BUCKET variable upload the packages to S3; SNAPCRAFT_STORE_CREDENTIALS publishes
# the snap to the edge channel. Without them those steps are skipped.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The desktop builds on 24.04 (see build); the engine builds on 22.04 so its glibc floor
  # stays at or below the oldest distro test-ubuntu installs on.
  engine:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-about
        run: cargo install --locked cargo-about --version 0.9.2 --features cli
      - name: Build the Rust engine
        run: apps/engine/packaging/build-release.sh linux
        env:
          OUT_DIR: ${{ runner.temp }}/engine-dist
          AIRPOST_REQUIRE_NOTICES: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-aarch64
          path: |
            ${{ runner.temp }}/engine-dist/aarch64-unknown-linux-gnu/airpost-engine
            ${{ runner.temp }}/engine-dist/aarch64-unknown-linux-gnu/THIRD-PARTY-NOTICES.txt
            ${{ runner.temp }}/engine-dist/aarch64-unknown-linux-gnu/airpost-mcp
            ${{ runner.temp }}/engine-dist/aarch64-unknown-linux-gnu/airpost
            ${{ runner.temp }}/engine-dist/aarch64-unknown-linux-gnu/airpost-mcp.THIRD-PARTY-NOTICES.txt
          retention-days: 1

  build:
    needs: engine
    runs-on: ubuntu-24.04-arm
    # contents: write only for the source tag (scripts/source-offer.sh).
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/desktop
    env:
      HAVE_AWS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && vars.BUILDS_S3_BUCKET != '' }}

    steps:
      - name: Fail if branch is not main
        if: github.ref != 'refs/heads/main' && !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v'))
        run: |
          echo "This workflow can only be run on main to ensure code-signed builds come from merged PRs"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            software-properties-common \
            autoconf automake build-essential clang cmake fakeroot git \
            libc-ares-dev libctemplate-dev libcurl4-openssl-dev libglib2.0-dev \
            libicu-dev libsasl2-dev libsasl2-modules libsasl2-modules-gssapi-mit \
            libsecret-1-dev libssl-dev libnss3 libnss3-dev libtidy-dev libtool \
            libxext-dev libxkbfile-dev libxml2-dev libxtst-dev pkg-config rpm \
            uuid-dev xvfb
          # Note: execstack is not available on ARM64 and not needed for aarch64 binaries.

      - name: Download the Rust engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-aarch64
          path: ${{ runner.temp }}/engine

      - name: Install the Rust engine
        run: |
          install -m 755 "$RUNNER_TEMP/engine/airpost-engine" airpost-engine
          install -m 644 "$RUNNER_TEMP/engine/THIRD-PARTY-NOTICES.txt" airpost-engine.THIRD-PARTY-NOTICES.txt
          install -m 755 "$RUNNER_TEMP/engine/airpost-mcp" airpost-mcp
          install -m 755 "$RUNNER_TEMP/engine/airpost" airpost
          install -m 644 "$RUNNER_TEMP/engine/airpost-mcp.THIRD-PARTY-NOTICES.txt" airpost-mcp.THIRD-PARTY-NOTICES.txt

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            apps/desktop/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: DEBUG=electron-packager npm run build

      # GPLv3 section 6(d): a tag pins the source and SOURCE.txt, published next to every
      # package, points to it.
      - name: Source offer
        run: |
          tag="desktop-$(node -p "require('./package.json').version")-$(git rev-parse --short=8 HEAD)"
          ../../.github/scripts/source-offer.sh "$tag" dist "the Airpost desktop app"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup AWS CLI
        if: env.HAVE_AWS == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync Artifacts to S3
        if: env.HAVE_AWS == 'true'
        run: |
          aws s3 sync dist/ "s3://$BUCKET/client/$(git rev-parse --short=8 HEAD)/linux-arm64" \
            --acl public-read \
            --exclude "*" --include "*.deb" --include "*.rpm" --include "SOURCE.txt"
        env:
          BUCKET: ${{ vars.BUILDS_S3_BUCKET }}

      - name: Upload DEB artifact for testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: airpost-arm64-deb
          path: |
            apps/desktop/dist/*.deb
            apps/desktop/dist/SOURCE.txt
          retention-days: 1

      - name: Upload RPM artifact for testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: airpost-arm64-rpm
          path: |
            apps/desktop/dist/*.rpm
            apps/desktop/dist/SOURCE.txt
          retention-days: 1

  build-snap:
    needs: build
    runs-on: ubuntu-24.04-arm
    env:
      HAVE_SNAP: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download DEB artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: airpost-arm64-deb
          path: apps/desktop/dist/

      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: build-snap
        with:
          path: apps/desktop

      - uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        if: env.HAVE_SNAP == 'true'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build-snap.outputs.snap }}
          release: edge

  test-ubuntu:
    needs: build
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        ubuntu_version: ['22.04', '24.04', '25.04']
    steps:
      - name: Download DEB artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: airpost-arm64-deb

      - name: Test installation on Ubuntu ${{ matrix.ubuntu_version }} (arm64)
        run: |
          docker run --rm --platform linux/arm64 -v ${{ github.workspace }}:/workspace ubuntu:${{ matrix.ubuntu_version }} bash -c "
            set -e
            echo '=== Testing Airpost ARM64 installation on Ubuntu ${{ matrix.ubuntu_version }} ==='

            cd /workspace
            export DEBIAN_FRONTEND=noninteractive
            apt-get update

            dpkg -i *.deb || true
            apt-get install -f -y
            apt-get install -y xvfb file

            dpkg -l | grep airpost || (echo '✗ Airpost package not installed' && exit 1)
            which airpost || (echo '✗ airpost binary not found in PATH' && exit 1)

            echo 'Installed files:'
            dpkg -L airpost | head -20

            echo 'Verifying ARM64 binary...'
            file /usr/share/airpost/airpost | grep -iE 'aarch64|arm'
            echo '✓ ARM64 binary confirmed'

            echo 'Running airpost --version...'
            xvfb-run -a airpost --version --no-sandbox > /tmp/version.txt 2>&1 || true
            cat /tmp/version.txt

            if grep -qE '[0-9]+\.[0-9]+\.[0-9]+' /tmp/version.txt; then
              echo '✓ airpost --version passed on Ubuntu ${{ matrix.ubuntu_version }} arm64'
            else
              echo '✗ airpost --version failed on Ubuntu ${{ matrix.ubuntu_version }} arm64'
              exit 1
            fi

            # Verify the engine binary exists
            if [ -f /usr/share/airpost/resources/app.asar.unpacked/airpost-engine ]; then
              AIRPOST_ENGINE_PATH=/usr/share/airpost/resources/app.asar.unpacked/airpost-engine
            else
              echo '✗ airpost-engine binary not found'
              ls -la /usr/share/airpost/ | head -30
              exit 1
            fi

            echo 'Running airpost-engine --help...'
            \$AIRPOST_ENGINE_PATH --help > /tmp/airpost-engine-help.txt 2>&1 || true
            cat /tmp/airpost-engine-help.txt

            if grep -qiE 'usage|help|airpost-engine|options|--mode' /tmp/airpost-engine-help.txt; then
              if grep -qi 'error' /tmp/airpost-engine-help.txt; then
                echo '✗ airpost-engine --help contains errors on Ubuntu ${{ matrix.ubuntu_version }} arm64'
                exit 1
              fi
              echo '✓ airpost-engine --help passed on Ubuntu ${{ matrix.ubuntu_version }} arm64'
            else
              echo '✗ airpost-engine --help failed on Ubuntu ${{ matrix.ubuntu_version }} arm64'
              exit 1
            fi

            echo '✓ Airpost ARM64 installation test passed on Ubuntu ${{ matrix.ubuntu_version }}'
          "

  test-fedora:
    needs: build
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        fedora_version: ['40', '41', '43']
    steps:
      - name: Download RPM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: airpost-arm64-rpm

      - name: Test installation on Fedora ${{ matrix.fedora_version }} (arm64)
        run: |
          docker run --rm --platform linux/arm64 -v ${{ github.workspace }}:/workspace fedora:${{ matrix.fedora_version }} bash -c "
            set -e
            echo '=== Testing Airpost ARM64 installation on Fedora ${{ matrix.fedora_version }} ==='

            cd /workspace
            dnf install -y xorg-x11-server-Xvfb which alsa-lib

            dnf install -y *.rpm

            rpm -q airpost || (echo '✗ Airpost package not installed' && exit 1)
            which airpost || (echo '✗ airpost binary not found in PATH' && exit 1)

            echo 'Installed files:'
            rpm -ql airpost | head -20

            echo 'Running airpost --version...'
            xvfb-run -a airpost --version --no-sandbox > /tmp/version.txt 2>&1 || true
            cat /tmp/version.txt

            if grep -qE '[0-9]+\.[0-9]+\.[0-9]+' /tmp/version.txt; then
              echo '✓ airpost --version passed on Fedora ${{ matrix.fedora_version }} arm64'
            else
              echo '✗ airpost --version failed on Fedora ${{ matrix.fedora_version }} arm64'
              exit 1
            fi

            # Verify the engine binary exists
            if [ -f /usr/share/airpost/resources/app.asar.unpacked/airpost-engine ]; then
              AIRPOST_ENGINE_PATH=/usr/share/airpost/resources/app.asar.unpacked/airpost-engine
            else
              echo '✗ airpost-engine binary not found'
              rpm -ql airpost | grep -i airpost-engine || echo 'No airpost-engine found in package'
              ls -la /usr/share/airpost/ | head -30
              exit 1
            fi

            echo 'Running airpost-engine --help...'
            \$AIRPOST_ENGINE_PATH --help > /tmp/airpost-engine-help.txt 2>&1 || true
            cat /tmp/airpost-engine-help.txt

            if grep -qiE 'usage|help|airpost-engine|options|--mode' /tmp/airpost-engine-help.txt; then
              if grep -qi 'error' /tmp/airpost-engine-help.txt; then
                echo '✗ airpost-engine --help contains errors on Fedora ${{ matrix.fedora_version }} arm64'
                exit 1
              fi
              echo '✓ airpost-engine --help passed on Fedora ${{ matrix.fedora_version }} arm64'
            else
              echo '✗ airpost-engine --help failed on Fedora ${{ matrix.fedora_version }} arm64'
              exit 1
            fi

            echo '✓ Airpost ARM64 installation test passed on Fedora ${{ matrix.fedora_version }}'
          "
