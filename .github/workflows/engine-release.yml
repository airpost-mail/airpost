name: engine-release

# Builds the release engine for macOS (arm64, x86_64, universal; signed with the hardened
# runtime and notarized when the APPLE_* secrets are set) and Linux (x86_64, arm64), using
# apps/engine/packaging/. A tag `engine-v*` also publishes the archives as a GitHub release,
# with SOURCE.txt and a source archive with every crate vendored (GPLv3 section 6). Each
# archive holds the binary with LICENSE.md, NOTICE.md and THIRD-PARTY-NOTICES.txt.
#
# Secrets (all optional; without them the macOS binaries are signed ad hoc and not notarized):
#   APPLE_CODESIGN_P12, APPLE_CODESIGN_KEY_PASSWORD  Developer ID Application certificate
#   APPLE_SIGNING_IDENTITY                           its name or SHA-1
#   APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER   notarytool API key, or
#   APPLE_ID, APPLE_ID_PASSWORD, APPLE_TEAM_ID             notarytool Apple ID

on:
  workflow_dispatch:
  push:
    tags: ["engine-v*"]

# Jobs get a read-only token unless they ask for more (only `release` does). Third-party
# actions are pinned to commits: the macOS job holds the Developer ID key in its keychain
# from the import step on, including during later steps' post-run hooks.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_ABOUT_VERSION: 0.9.2
  AIRPOST_REQUIRE_NOTICES: 1

jobs:
  macos:
    runs-on: macos-14
    env:
      HAVE_CERT: ${{ secrets.APPLE_CODESIGN_P12 != '' }}
      HAVE_NOTARY: ${{ secrets.APPLE_API_KEY_P8 != '' || secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-about
        run: cargo install --locked cargo-about --version "$CARGO_ABOUT_VERSION" --features cli

      - name: Build
        run: apps/engine/packaging/build-release.sh macos
        env:
          OUT_DIR: ${{ runner.temp }}/engine-dist

      - name: Import signing certificate
        if: env.HAVE_CERT == 'true'
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7.2.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CODESIGN_P12 }}
          p12-password: ${{ secrets.APPLE_CODESIGN_KEY_PASSWORD }}

      - name: Sign
        run: |
          [ "$HAVE_CERT" = true ] || export APPLE_SIGNING_IDENTITY=-
          apps/engine/packaging/macos/sign.sh "$DIST"/*-apple-darwin/airpost-engine
        env:
          DIST: ${{ runner.temp }}/engine-dist
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Notarize
        if: env.HAVE_CERT == 'true' && env.HAVE_NOTARY == 'true'
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/notary-key.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          fi
          apps/engine/packaging/macos/notarize.sh "$DIST"/*-apple-darwin/airpost-engine
        env:
          DIST: ${{ runner.temp }}/engine-dist
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Smoke test
        # Release builds only start from a path naming the product.
        run: |
          mkdir -p "$RUNNER_TEMP/airpost" "$RUNNER_TEMP/config"
          for t in aarch64-apple-darwin x86_64-apple-darwin universal-apple-darwin; do
            cp "$DIST/$t/airpost-engine" "$RUNNER_TEMP/airpost/airpost-engine"
            "$RUNNER_TEMP/airpost/airpost-engine" --help > /dev/null
            CONFIG_DIR_PATH="$RUNNER_TEMP/config" "$RUNNER_TEMP/airpost/airpost-engine" --mode migrate
          done
        env:
          DIST: ${{ runner.temp }}/engine-dist

      - name: Archive
        run: |
          mkdir -p "$RUNNER_TEMP/archives"
          for t in aarch64-apple-darwin x86_64-apple-darwin universal-apple-darwin; do
            tar -czf "$RUNNER_TEMP/archives/airpost-engine-$t.tar.gz" -C "$DIST/$t" \
              airpost-engine LICENSE.md NOTICE.md THIRD-PARTY-NOTICES.txt
          done
        env:
          DIST: ${{ runner.temp }}/engine-dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-macos
          path: ${{ runner.temp }}/archives/*.tar.gz

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 is the oldest distro the desktop's Linux packages are tested on.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-about
        run: cargo install --locked cargo-about --version "$CARGO_ABOUT_VERSION" --features cli

      - name: Build
        # On a native runner the script builds the runner's arch and skips the other.
        run: apps/engine/packaging/build-release.sh linux
        env:
          OUT_DIR: ${{ runner.temp }}/engine-dist

      - name: Smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/airpost" "$RUNNER_TEMP/config"
          cp "$DIST/${{ matrix.target }}/airpost-engine" "$RUNNER_TEMP/airpost/airpost-engine"
          ldd "$RUNNER_TEMP/airpost/airpost-engine"
          "$RUNNER_TEMP/airpost/airpost-engine" --help > /dev/null
          CONFIG_DIR_PATH="$RUNNER_TEMP/config" "$RUNNER_TEMP/airpost/airpost-engine" --mode migrate
        env:
          DIST: ${{ runner.temp }}/engine-dist

      - name: Archive
        run: |
          mkdir -p "$RUNNER_TEMP/archives"
          tar -czf "$RUNNER_TEMP/archives/airpost-engine-${{ matrix.target }}.tar.gz" \
            -C "$DIST/${{ matrix.target }}" airpost-engine LICENSE.md NOTICE.md THIRD-PARTY-NOTICES.txt
          tar -czf "$RUNNER_TEMP/archives/airpost-engine-${{ matrix.target }}-debug.tar.gz" \
            -C "$DIST/${{ matrix.target }}" airpost-engine.debug LICENSE.md NOTICE.md THIRD-PARTY-NOTICES.txt
        env:
          DIST: ${{ runner.temp }}/engine-dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-${{ matrix.target }}
          path: ${{ runner.temp }}/archives/*.tar.gz

  # The Corresponding Source of the binaries: the Cargo workspace at this commit plus the exact
  # crate sources Cargo.lock pins, so the release builds without crates.io. The harness
  # (apps/engine/test) is not part of the build and stays out.
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92
      - name: Archive the source with vendored crates
        run: |
          name="airpost-engine-src-${GITHUB_REF_NAME//\//-}"
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/archives"
          git archive --format=tar --prefix="$name/" HEAD -- Cargo.toml Cargo.lock \
            rust-toolchain.toml deny.toml LICENSE.md NOTICE.md distribution/licenses \
            apps/engine apps/backend crates ':(exclude)apps/engine/test' |
            tar -x -C "$RUNNER_TEMP/src"
          cd "$RUNNER_TEMP/src/$name"
          mkdir -p .cargo
          cargo vendor --locked --versioned-dirs vendor > .cargo/config.toml
          cd ..
          tar -czf "$RUNNER_TEMP/archives/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-source
          path: ${{ runner.temp }}/archives/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/engine-v')
    needs: [macos, linux, source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: archives
          merge-multiple: true
      - name: Source offer
        run: .github/scripts/source-offer.sh --no-tag "$GITHUB_REF_NAME" archives "the Airpost sync engine (airpost-engine)"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish
        run: |
          cd archives
          sha256sum ./*.tar.gz SOURCE.txt > SHA256SUMS
          # Not "latest": that is the vX.Y.Z release (release.yml) install.sh is fetched from.
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --latest=false \
            --title "Engine ${GITHUB_REF_NAME#engine-v}" --generate-notes ./*
        env:
          GH_TOKEN: ${{ github.token }}
