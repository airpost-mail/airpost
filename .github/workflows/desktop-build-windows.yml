name: desktop-build-windows

# Builds the Windows installer. There is no Windows build of the Rust engine yet
# (docs/engine-port-plan.md section 11), so this app ships without a sync engine. It must not
# ship the C++ engine: legacy/mailsync-cpp's Windows build links the vendored OpenSSL 1.1 DLLs,
# whose licence is incompatible with the GPL, and the build fails if one is present.
#
# Secrets (all optional; without the AZURE_* ones every signing step is skipped and the
# installer is unsigned): AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
# AZURE_TRUSTED_SIGNING_ENDPOINT, with the AZURE_TRUSTED_SIGNING_ACCOUNT_NAME and
# AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME variables. AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY with the BUILDS_S3_BUCKET variable upload to S3.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    # contents: write only for the source tag (scripts/source-offer.sh).
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/desktop
    env:
      HAVE_SIGNING: ${{ secrets.AZURE_CLIENT_SECRET != '' && secrets.AZURE_TRUSTED_SIGNING_ENDPOINT != '' }}
      HAVE_AWS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && vars.BUILDS_S3_BUCKET != '' }}

    steps:
      - name: Fail if branch is not main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "This workflow should not be triggered with workflow_dispatch on a branch other than main"
          exit 1

      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Cache NodeJS modules
        uses: actions/cache@v6
        with:
          path: |
            apps/desktop/node_modules
            apps/desktop/app/node_modules
          key: windows-2022-deps-${{ hashFiles('apps/desktop/package-lock.json') }}-${{ hashFiles('apps/desktop/app/package-lock.json') }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/desktop/app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Refuse a C++ engine or OpenSSL DLLs
        shell: bash
        run: |
          found="$(find app -path app/node_modules -prune -o -type f \( -iname 'mailsync.exe' \
            -o -iname 'libcrypto*.dll' -o -iname 'libssl*.dll' -o -iname 'libeay32*.dll' \
            -o -iname 'ssleay32*.dll' \) -print)"
          if [ -n "$found" ]; then
            echo "Not shipping the C++ engine or OpenSSL (GPL-incompatible):"
            echo "$found"
            exit 1
          fi

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build
        env:
          DEBUG: electron-packager

      - name: Sign Application Files with Azure Trusted Signing
        if: env.HAVE_SIGNING == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\apps\desktop\app\dist\Tern-win32-x64
          files-folder-filter: exe,dll,node
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Set Up Trusted Signing for the Installer Build
        if: env.HAVE_SIGNING == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'trusted-signing'

          # Squirrel signs the binaries it generates itself, so it needs the dlib
          # the azure/trusted-signing-action steps use internally.
          Invoke-WebRequest -Uri 'https://www.nuget.org/api/v2/package/Microsoft.Trusted.Signing.Client' -OutFile "$dir.zip"
          Expand-Archive -Path "$dir.zip" -DestinationPath $dir -Force
          $dlib = Get-ChildItem -Path $dir -Filter 'Azure.CodeSigning.Dlib.dll' -Recurse |
            Where-Object { $_.FullName -like '*\x64\*' } | Select-Object -First 1
          if (-not $dlib) { throw 'Could not find Azure.CodeSigning.Dlib.dll' }

          $metadata = Join-Path $dir 'metadata.json'
          @{
            Endpoint = '${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}'
            CodeSigningAccountName = '${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}'
            CertificateProfileName = '${{ vars.AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME }}'
          } | ConvertTo-Json | Set-Content -Path $metadata -Encoding utf8

          # The dlib needs SignTool from Windows SDK 10.0.22621.755 or newer:
          # https://learn.microsoft.com/en-us/azure/trusted-signing/how-to-signing-integrations
          # SDK directories are named for the base release (10.0.22621.0), not the
          # servicing build, so compare against 10.0.22621 and take the newest.
          $signtool = Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter 'signtool.exe' -Recurse |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            ForEach-Object {
              $sdk = $_.Directory.Parent.Name -as [version]
              if ($sdk) { [pscustomobject]@{ Version = $sdk; Path = $_.FullName } }
            } | Sort-Object Version | Select-Object -Last 1
          if (-not $signtool -or $signtool.Version -lt [version]'10.0.22621') {
            throw 'Trusted Signing needs SignTool from Windows SDK 10.0.22621.755 or newer'
          }

          "WINDOWS_SIGNTOOL_PATH=$($signtool.Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WINDOWS_SIGN_PARAMS=/v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib `"$($dlib.FullName)`" /dmdf `"$metadata`"" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create Windows Installer
        run: node build/create-signed-windows-installer.js
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Sign Windows Installer with Azure Trusted Signing
        if: env.HAVE_SIGNING == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\apps\desktop\app\dist
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Every Shipped Binary Is Signed
        if: env.HAVE_SIGNING == 'true'
        run: node build/verify-windows-signatures.js

      # GPLv3 section 6(d): a tag pins the source and SOURCE.txt, published next to every
      # package, points to it.
      - name: Source offer
        shell: bash
        run: |
          tag="desktop-$(node -p "require('./app/package.json').version")-$(git rev-parse --short=8 HEAD)"
          ../../.github/scripts/source-offer.sh "$tag" app/dist "the Tern desktop app"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-x64
          path: |
            apps/desktop/app/dist/TernSetup.exe
            apps/desktop/app/dist/*.nupkg
            apps/desktop/app/dist/RELEASES
            apps/desktop/app/dist/SOURCE.txt

      - name: Setup AWS CLI
        if: env.HAVE_AWS == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync Artifacts to S3
        if: env.HAVE_AWS == 'true'
        shell: pwsh
        env:
          BUCKET: ${{ vars.BUILDS_S3_BUCKET }}
        run: |
          $commit = git rev-parse --short=8 HEAD
          aws s3 sync app/dist/ "s3://$env:BUCKET/client/$commit/win-x64" `
            --acl public-read `
            --exclude "*" `
            --include "TernSetup.exe" `
            --include "*.nupkg" `
            --include "RELEASES" `
            --include "SOURCE.txt"
