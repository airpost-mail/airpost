name: desktop-build-linux

# Builds the x64 .deb and .rpm with the Rust engine (apps/desktop/airpost-engine), builds the snap from
# the .deb, and installs the packages on several distros. Run by hand on main, or by
# desktop-release.yml for a desktop-vX.Y.Z tag on main.
#
# Secrets (all optional): AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY with the
# BUILDS_S3_BUCKET variable upload the packages to S3; SNAPCRAFT_STORE_CREDENTIALS publishes
# the snap to the edge channel. Without them those steps are skipped.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-22.04
    # contents: write only for the source tag (scripts/source-offer.sh).
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/desktop

    # Electron 43's V8 headers declare classes as `class [[deprecated(...)]]
    # __attribute__((visibility("default"))) Value`, an attribute ordering no GCC
    # before 13 can parse, so better-sqlite3 fails to build with 22.04's GCC 11.
    # Clang 15 accepts it and still links against 22.04's libstdc++, keeping the
    # glibc/libstdc++ baseline that test-ubuntu 22.04 verifies. (Clang 14, the
    # distro default, is too old: it lacks the builtin std::source_location needs.)
    env:
      CC: clang-15
      CXX: clang++-15
      HAVE_AWS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && vars.BUILDS_S3_BUCKET != '' }}

    steps:
      - name: Fail if branch is not main
        if: github.ref != 'refs/heads/main' && !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v'))
        run: |
          echo "This workflow can only be run on main to ensure code-signed builds come from merged PRs"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            software-properties-common \
            autoconf automake build-essential clang clang-15 cmake execstack fakeroot git \
            libc-ares-dev libctemplate-dev libcurl4-openssl-dev libglib2.0-dev \
            libicu-dev libsasl2-dev libsasl2-modules libsasl2-modules-gssapi-mit \
            libsecret-1-dev libssl-dev libnss3 libnss3-dev libtidy-dev libtool \
            libxext-dev libxkbfile-dev libxml2-dev libxtst-dev pkg-config rpm \
            uuid-dev xvfb
          # Note: dropped g++-5 and libgnome-keyring-dev (not available on 22.04).
          # No PPA needed on 22.04 for these packages.

      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-about
        run: cargo install --locked cargo-about --version 0.9.2 --features cli

      # Built on 22.04 so the engine's glibc floor stays at or below the oldest tested distro.
      - name: Build and install the Rust engine
        run: ../engine/packaging/build-release.sh linux --install-desktop=x64
        env:
          AIRPOST_REQUIRE_NOTICES: 1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            apps/desktop/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: DEBUG=electron-packager npm run build

      # GPLv3 section 6(d): a tag pins the source and SOURCE.txt, published next to every
      # package, points to it.
      - name: Source offer
        run: |
          tag="desktop-$(node -p "require('./package.json').version")-$(git rev-parse --short=8 HEAD)"
          ../../.github/scripts/source-offer.sh "$tag" dist "the Airpost desktop app"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup AWS CLI
        if: env.HAVE_AWS == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync Artifacts to S3
        if: env.HAVE_AWS == 'true'
        run: |
          aws s3 sync dist/ "s3://$BUCKET/client/$(git rev-parse --short=8 HEAD)/linux" \
            --acl public-read \
            --exclude "*" --include "*.deb" --include "*.rpm" --include "SOURCE.txt"
        env:
          BUCKET: ${{ vars.BUILDS_S3_BUCKET }}

      - name: Upload DEB artifact for testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: airpost-deb
          path: |
            apps/desktop/dist/*.deb
            apps/desktop/dist/SOURCE.txt
          retention-days: 1

      - name: Upload RPM artifact for testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: airpost-rpm
          path: |
            apps/desktop/dist/*.rpm
            apps/desktop/dist/SOURCE.txt
          retention-days: 1

  build-snap:
    needs: build
    runs-on: ubuntu-22.04
    env:
      HAVE_SNAP: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download DEB artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: airpost-deb
          path: apps/desktop/dist/

      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: build-snap
        with:
          path: apps/desktop

      - uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        if: env.HAVE_SNAP == 'true'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build-snap.outputs.snap }}
          release: edge

  test-ubuntu:
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        ubuntu_version: ['22.04', '24.04', '25.04']
    steps:
      - name: Download DEB artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: airpost-deb

      - name: Test installation on Ubuntu ${{ matrix.ubuntu_version }}
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace ubuntu:${{ matrix.ubuntu_version }} bash -c "
            set -e
            echo '=== Testing Airpost installation on Ubuntu ${{ matrix.ubuntu_version }} ==='

            # Install the DEB package (this will auto-install dependencies)
            cd /workspace
            export DEBIAN_FRONTEND=noninteractive
            apt-get update

            # First try to install the .deb which will fail with dependency errors
            dpkg -i *.deb || true

            # Install the missing dependencies (automatically resolves from package metadata)
            apt-get install -f -y

            # Install xvfb for virtual display (needed for tests, not a package dependency)
            apt-get install -y xvfb

            # Verify installation succeeded
            dpkg -l | grep airpost || (echo '✗ Airpost package not installed' && exit 1)

            # Verify the binary exists and is executable
            which airpost-desktop || (echo '✗ airpost-desktop binary not found in PATH' && exit 1)

            # List installed files
            echo 'Installed files:'
            dpkg -L airpost | head -20

            # Run airpost-desktop --version with virtual display (use --no-sandbox for Docker)
            echo 'Running airpost-desktop --version...'
            xvfb-run -a airpost-desktop --version --no-sandbox > /tmp/version.txt 2>&1 || true
            cat /tmp/version.txt

            # Verify version command succeeded (output should contain a version number)
            if grep -qE '[0-9]+\.[0-9]+\.[0-9]+' /tmp/version.txt; then
              echo '✓ airpost-desktop --version passed on Ubuntu ${{ matrix.ubuntu_version }}'
            else
              echo '✗ airpost-desktop --version failed on Ubuntu ${{ matrix.ubuntu_version }}'
              exit 1
            fi

            # Verify the engine binary exists
            if [ -f /usr/share/airpost/resources/app.asar.unpacked/airpost-engine ]; then
              AIRPOST_ENGINE_PATH=/usr/share/airpost/resources/app.asar.unpacked/airpost-engine
            else
              echo '✗ airpost-engine binary not found'
              echo 'Files in /usr/share/airpost/:'
              ls -la /usr/share/airpost/ | head -30
              exit 1
            fi

            # Run airpost-engine --help (no X11 required)
            echo 'Running airpost-engine --help...'
            \$AIRPOST_ENGINE_PATH --help > /tmp/airpost-engine-help.txt 2>&1 || true
            cat /tmp/airpost-engine-help.txt

            # Verify airpost-engine help output (should contain usage info and no errors)
            if grep -qiE 'usage|help|airpost-engine|options|--mode' /tmp/airpost-engine-help.txt; then
              if grep -qi 'error' /tmp/airpost-engine-help.txt; then
                echo '✗ airpost-engine --help contains errors on Ubuntu ${{ matrix.ubuntu_version }}'
                exit 1
              fi
              echo '✓ airpost-engine --help passed on Ubuntu ${{ matrix.ubuntu_version }}'
            else
              echo '✗ airpost-engine --help failed on Ubuntu ${{ matrix.ubuntu_version }}'
              exit 1
            fi

            echo '✓ Airpost installation test passed on Ubuntu ${{ matrix.ubuntu_version }}'
          "

  test-fedora:
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        fedora_version: ['40', '41', '43']
    steps:
      - name: Download RPM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: airpost-rpm

      - name: Test installation on Fedora ${{ matrix.fedora_version }}
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace fedora:${{ matrix.fedora_version }} bash -c "
            set -e
            echo '=== Testing Airpost installation on Fedora ${{ matrix.fedora_version }} ==='

            # Install dependencies first
            cd /workspace
            dnf install -y xorg-x11-server-Xvfb which alsa-lib

            # Install the RPM package (dnf will auto-resolve dependencies)
            dnf install -y *.rpm

            # Verify installation succeeded
            rpm -q airpost || (echo '✗ Airpost package not installed' && exit 1)

            # Verify the binary exists and is executable
            which airpost-desktop || (echo '✗ airpost-desktop binary not found in PATH' && exit 1)

            # List installed files
            echo 'Installed files:'
            rpm -ql airpost | head -20

            # Run airpost-desktop --version with virtual display (use --no-sandbox for Docker)
            echo 'Running airpost-desktop --version...'
            xvfb-run -a airpost-desktop --version --no-sandbox > /tmp/version.txt 2>&1 || true
            cat /tmp/version.txt

            # Verify version command succeeded (output should contain a version number)
            if grep -qE '[0-9]+\.[0-9]+\.[0-9]+' /tmp/version.txt; then
              echo '✓ airpost-desktop --version passed on Fedora ${{ matrix.fedora_version }}'
            else
              echo '✗ airpost-desktop --version failed on Fedora ${{ matrix.fedora_version }}'
              exit 1
            fi

            # Verify the engine binary exists
            if [ -f /usr/share/airpost/resources/app.asar.unpacked/airpost-engine ]; then
              AIRPOST_ENGINE_PATH=/usr/share/airpost/resources/app.asar.unpacked/airpost-engine
            else
              echo '✗ airpost-engine binary not found'
              echo 'Searching for airpost-engine in RPM files:'
              rpm -ql airpost | grep -i airpost-engine || echo 'No airpost-engine found in package'
              echo 'Files in /usr/share/airpost/:'
              ls -la /usr/share/airpost/ | head -30
              exit 1
            fi

            # Run airpost-engine --help (no X11 required)
            echo 'Running airpost-engine --help...'
            \$AIRPOST_ENGINE_PATH --help > /tmp/airpost-engine-help.txt 2>&1 || true
            cat /tmp/airpost-engine-help.txt

            # Verify airpost-engine help output (should contain usage info and no errors)
            # Note: libcurl version warnings are harmless and expected on Fedora
            if grep -qiE 'usage|help|airpost-engine|options|--mode' /tmp/airpost-engine-help.txt; then
              if grep -qi 'error' /tmp/airpost-engine-help.txt; then
                echo '✗ airpost-engine --help contains errors on Fedora ${{ matrix.fedora_version }}'
                exit 1
              fi
              echo '✓ airpost-engine --help passed on Fedora ${{ matrix.fedora_version }}'
            else
              echo '✗ airpost-engine --help failed on Fedora ${{ matrix.fedora_version }}'
              exit 1
            fi

            echo '✓ Airpost installation test passed on Fedora ${{ matrix.fedora_version }}'
          "

  test-opensuse:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download RPM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: airpost-rpm

      - name: Test installation on openSUSE Tumbleweed
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace opensuse/tumbleweed bash -c "
            set -e
            echo '=== Testing Airpost installation on openSUSE Tumbleweed ==='

            # Install dependencies first
            cd /workspace

            # Note: zypper exit code 107 (ZYPPER_EXIT_INF_RPM_SCRIPT_FAILED) means
            # the package installed but an RPM scriptlet failed. This is expected in
            # Docker containers where PAM/systemd scriptlets cannot run properly.
            zypper --non-interactive install xorg-x11-server-Xvfb xvfb-run which alsa-lib gawk; ZYPPER_EXIT=\$?
            if [ \$ZYPPER_EXIT -ne 0 ] && [ \$ZYPPER_EXIT -ne 107 ]; then
              echo \"zypper install dependencies failed with exit code \$ZYPPER_EXIT\"
              exit 1
            fi

            # Install the RPM package (zypper will auto-resolve dependencies)
            zypper --non-interactive --no-gpg-checks install *.rpm; ZYPPER_EXIT=\$?
            if [ \$ZYPPER_EXIT -ne 0 ] && [ \$ZYPPER_EXIT -ne 107 ]; then
              echo \"zypper install airpost failed with exit code \$ZYPPER_EXIT\"
              exit 1
            fi

            # Verify installation succeeded
            rpm -q airpost || (echo '✗ Airpost package not installed' && exit 1)

            # Verify the binary exists and is executable
            which airpost-desktop || (echo '✗ airpost-desktop binary not found in PATH' && exit 1)

            # List installed files
            echo 'Installed files:'
            rpm -ql airpost | head -20

            # Run airpost-desktop --version with virtual display (use --no-sandbox for Docker)
            echo 'Running airpost-desktop --version...'
            xvfb-run -a airpost-desktop --version --no-sandbox > /tmp/version.txt 2>&1 || true
            cat /tmp/version.txt

            # Verify version command succeeded (output should contain a version number)
            if grep -qE '[0-9]+\.[0-9]+\.[0-9]+' /tmp/version.txt; then
              echo '✓ airpost-desktop --version passed on openSUSE Tumbleweed'
            else
              echo '✗ airpost-desktop --version failed on openSUSE Tumbleweed'
              exit 1
            fi

            # Verify the engine binary exists
            if [ -f /usr/share/airpost/resources/app.asar.unpacked/airpost-engine ]; then
              AIRPOST_ENGINE_PATH=/usr/share/airpost/resources/app.asar.unpacked/airpost-engine
            else
              echo '✗ airpost-engine binary not found'
              echo 'Searching for airpost-engine in RPM files:'
              rpm -ql airpost | grep -i airpost-engine || echo 'No airpost-engine found in package'
              echo 'Files in /usr/share/airpost/:'
              ls -la /usr/share/airpost/ | head -30
              exit 1
            fi

            # Run airpost-engine --help (no X11 required)
            echo 'Running airpost-engine --help...'
            \$AIRPOST_ENGINE_PATH --help > /tmp/airpost-engine-help.txt 2>&1 || true
            cat /tmp/airpost-engine-help.txt

            # Verify airpost-engine help output (should contain usage info and no errors)
            if grep -qiE 'usage|help|airpost-engine|options|--mode' /tmp/airpost-engine-help.txt; then
              if grep -qi 'error' /tmp/airpost-engine-help.txt; then
                echo '✗ airpost-engine --help contains errors on openSUSE Tumbleweed'
                exit 1
              fi
              echo '✓ airpost-engine --help passed on openSUSE Tumbleweed'
            else
              echo '✗ airpost-engine --help failed on openSUSE Tumbleweed'
              exit 1
            fi

            echo '✓ Airpost installation test passed on openSUSE Tumbleweed'
          "

  test-arch:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download DEB artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: airpost-deb

      - name: Test installation on Arch Linux
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace archlinux:latest bash -c "
            set -e
            echo '=== Testing Airpost installation on Arch Linux ==='

            # Update package database and install required tools and libraries
            pacman -Syu --noconfirm
            pacman -S --noconfirm xorg-server-xvfb binutils nspr nss gtk3 alsa-lib tidy

            # Extract the DEB package manually (ar + tar)
            cd /workspace
            DEB_FILE=\$(ls *.deb)
            echo \"Extracting \$DEB_FILE...\"

            # Extract .deb (which is an ar archive)
            ar x \"\$DEB_FILE\"

            # Extract data tarball to root
            tar -xf data.tar.* -C /

            # Verify the binary exists and is in PATH
            ls -la /usr/bin/airpost-desktop
            ls -la /usr/share/airpost/

            # List installed files
            echo 'Extracted files:'
            find /usr/share/airpost -type f | head -20

            # Run airpost-desktop --version with virtual display (use --no-sandbox for Docker)
            echo 'Running airpost-desktop --version...'
            xvfb-run -a /usr/bin/airpost-desktop --version --no-sandbox > /tmp/version.txt 2>&1 || true
            cat /tmp/version.txt

            # Verify version command succeeded (output should contain a version number)
            if grep -qE '[0-9]+\.[0-9]+\.[0-9]+' /tmp/version.txt; then
              echo '✓ airpost-desktop --version passed on Arch Linux'
            else
              echo '✗ airpost-desktop --version failed on Arch Linux'
              exit 1
            fi

            # Verify the engine binary exists
            if [ -f /usr/share/airpost/resources/app.asar.unpacked/airpost-engine ]; then
              AIRPOST_ENGINE_PATH=/usr/share/airpost/resources/app.asar.unpacked/airpost-engine
            else
              echo '✗ airpost-engine binary not found'
              echo 'Files in /usr/share/airpost/:'
              ls -la /usr/share/airpost/ | head -30
              exit 1
            fi

            # Run airpost-engine --help (no X11 required)
            echo 'Running airpost-engine --help...'
            \$AIRPOST_ENGINE_PATH --help > /tmp/airpost-engine-help.txt 2>&1 || true
            cat /tmp/airpost-engine-help.txt

            # Verify airpost-engine help output (should contain usage info and no errors)
            if grep -qiE 'usage|help|airpost-engine|options|--mode' /tmp/airpost-engine-help.txt; then
              if grep -qi 'error' /tmp/airpost-engine-help.txt; then
                echo '✗ airpost-engine --help contains errors on Arch Linux'
                exit 1
              fi
              echo '✓ airpost-engine --help passed on Arch Linux'
            else
              echo '✗ airpost-engine --help failed on Arch Linux'
              exit 1
            fi

            echo '✓ Airpost installation test passed on Arch Linux'
          "

  test-linuxmint:
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        mint_version: ['22']
    steps:
      - name: Download DEB artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: airpost-deb

      - name: Test installation on Linux Mint ${{ matrix.mint_version }}
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace linuxmintd/mint${{ matrix.mint_version }}-amd64 bash -c "
            set -e
            echo '=== Testing Airpost installation on Linux Mint ${{ matrix.mint_version }} ==='

            # Install the DEB package using gdebi (what most users use)
            # gdebi has stricter dependency checking than apt-get install -f
            # and will fail if dependencies reference old package names that
            # don't resolve properly (e.g., libgtk-3-0 vs libgtk-3-0t64)
            cd /workspace
            export DEBIAN_FRONTEND=noninteractive
            apt-get update

            # Install gdebi and xvfb
            apt-get install -y gdebi-core xvfb

            # Use gdebi to install - this will fail if dependencies can't be resolved
            # gdebi is what users get when they double-click a .deb file
            gdebi --non-interactive *.deb

            # Verify installation succeeded
            dpkg -l | grep airpost || (echo '✗ Airpost package not installed' && exit 1)

            # Verify the binary exists and is executable
            which airpost-desktop || (echo '✗ airpost-desktop binary not found in PATH' && exit 1)

            # List installed files
            echo 'Installed files:'
            dpkg -L airpost | head -20

            # Run airpost-desktop --version with virtual display (use --no-sandbox for Docker)
            echo 'Running airpost-desktop --version...'
            xvfb-run -a airpost-desktop --version --no-sandbox > /tmp/version.txt 2>&1 || true
            cat /tmp/version.txt

            # Verify version command succeeded (output should contain a version number)
            if grep -qE '[0-9]+\.[0-9]+\.[0-9]+' /tmp/version.txt; then
              echo '✓ airpost-desktop --version passed on Linux Mint ${{ matrix.mint_version }}'
            else
              echo '✗ airpost-desktop --version failed on Linux Mint ${{ matrix.mint_version }}'
              exit 1
            fi

            # Verify the engine binary exists
            if [ -f /usr/share/airpost/resources/app.asar.unpacked/airpost-engine ]; then
              AIRPOST_ENGINE_PATH=/usr/share/airpost/resources/app.asar.unpacked/airpost-engine
            else
              echo '✗ airpost-engine binary not found'
              echo 'Files in /usr/share/airpost/:'
              ls -la /usr/share/airpost/ | head -30
              exit 1
            fi

            # Run airpost-engine --help (no X11 required)
            echo 'Running airpost-engine --help...'
            \$AIRPOST_ENGINE_PATH --help > /tmp/airpost-engine-help.txt 2>&1 || true
            cat /tmp/airpost-engine-help.txt

            # Verify airpost-engine help output (should contain usage info and no errors)
            if grep -qiE 'usage|help|airpost-engine|options|--mode' /tmp/airpost-engine-help.txt; then
              if grep -qi 'error' /tmp/airpost-engine-help.txt; then
                echo '✗ airpost-engine --help contains errors on Linux Mint ${{ matrix.mint_version }}'
                exit 1
              fi
              echo '✓ airpost-engine --help passed on Linux Mint ${{ matrix.mint_version }}'
            else
              echo '✗ airpost-engine --help failed on Linux Mint ${{ matrix.mint_version }}'
              exit 1
            fi

            echo '✓ Airpost installation test passed on Linux Mint ${{ matrix.mint_version }}'
          "
