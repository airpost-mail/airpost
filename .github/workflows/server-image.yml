name: server-image

# Builds the airpost-server image (deploy/server/Dockerfile, with the repo root as the context as in
# deploy/server/compose.build.yaml) for linux/amd64 and linux/arm64, each on a runner of that
# arch. A tag vX.Y.Z (matching Cargo.toml's workspace version) pushes it to
# ghcr.io/airpost-mail/airpost-server as X.Y.Z and, unless it is a prerelease, latest, which
# deploy/server/compose.yaml pulls; its SOURCE.txt and OCI labels name the tag. A manual run
# builds both without pushing.
#
# Secrets: none; the push uses GITHUB_TOKEN with packages: write.

on:
  workflow_dispatch:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

# Jobs get a read-only token unless they ask for more (only `build` and `push` do).
permissions:
  contents: read

env:
  IMAGE: ghcr.io/airpost-mail/airpost-server
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag against Cargo.toml
        if: env.PUBLISH == 'true'
        run: |
          want="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
          [ "${GITHUB_REF_NAME#v}" = "$want" ] || { echo "tag $GITHUB_REF_NAME, Cargo.toml $want" >&2; exit 1; }
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/server/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            SOURCE_TAG=${{ env.PUBLISH == 'true' && github.ref_name || '' }}
            SOURCE_REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
      - name: Export the digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  push:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Tag the multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          version="${GITHUB_REF_NAME#v}"
          tags=(-t "$IMAGE:$version")
          case "$version" in *-*) ;; *) tags+=(-t "$IMAGE:latest") ;; esac
          refs=()
          for d in *; do refs+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.licenses=GPL-3.0-only" \
            --annotation "index:org.opencontainers.image.version=$GITHUB_REF_NAME" \
            "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$version"
