# cargo deny check licenses — docs/engine-port-plan.md section 12. Everything links into a
# GPL-3.0-only program, so only GPLv3-compatible licences are allowed.

[graph]
all-features = false

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
# MIT-0 and MPL-2.0 are allowed by the plan but not used yet.
unused-allowed-license = "allow"

[licenses.private]
# The workspace's own crates are unpublished: GPL-3.0-only, except tern-backend and ms-wire
# (MIT), whose stricter policy is apps/backend/deny.toml.
ignore = true

[bans]
multiple-versions = "allow"
# aws-lc's OpenSSL-licensed code is not GPL-compatible (see the reqwest note in Cargo.toml).
deny = [
    { crate = "aws-lc-rs" },
    { crate = "aws-lc-sys" },
    { crate = "openssl-sys" },
]

[advisories]
version = 2
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
