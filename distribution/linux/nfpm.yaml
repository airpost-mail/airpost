# nfpm config for the airpost-cli .deb and .rpm, packed from one unpacked release archive by
# distribution/linux/build-packages.sh, which sets VERSION and ARCH (amd64, arm64) and runs nfpm
# in the unpacked archive (the src paths are relative to it).
#
# The package is airpost-cli, not airpost: the desktop's packages (apps/desktop/build/mkdeb, mkrpm)
# are named airpost and own /usr/share/airpost. Both install side by side. No systemd units: `airpost
# engine install` writes the user's unit (~/.config/systemd/user/airpost-engine.service), and a
# packaged unit of the same name would be a second owner.
name: airpost-cli
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: 1
section: mail
priority: optional
maintainer: Airpost contributors <https://github.com/airpost-mail/airpost/issues>
vendor: Airpost
homepage: https://github.com/airpost-mail/airpost
license: GPL-3.0-only
description: |-
  Airpost mail engine, command-line client, MCP server and web gateway
  The programs behind the Airpost email client, without the desktop app: airpost-engine syncs mail,
  calendars and contacts; airpost is the command-line client; airpost-mcp gives AI agents access
  through the Model Context Protocol; airpost-gateway serves the web client.

contents:
  - src: ./bin/airpost
    dst: /usr/bin/airpost
    file_info: { mode: 0755 }
  - src: ./bin/airpost-engine
    dst: /usr/bin/airpost-engine
    file_info: { mode: 0755 }
  - src: ./bin/airpost-mcp
    dst: /usr/bin/airpost-mcp
    file_info: { mode: 0755 }
  - src: ./bin/airpost-gateway
    dst: /usr/bin/airpost-gateway
    file_info: { mode: 0755 }
  - src: ./share/airpost-gateway/web
    dst: /usr/share/airpost-gateway/web
    type: tree
  - src: ./share/doc/airpost
    dst: /usr/share/doc/airpost-cli
    type: tree
  # Debian's place for the licence; build-packages.sh writes it from NOTICE.md and LICENSE.md.
  - src: ./copyright
    dst: /usr/share/doc/airpost-cli/copyright
    packager: deb
    file_info: { mode: 0644 }

overrides:
  deb:
    # build-release.sh builds on Debian bullseye (glibc 2.31); Rust's unwinder needs libgcc_s.
    # TLS reads the system's CA store.
    depends:
      - libc6 (>= 2.31)
      - libgcc-s1 | libgcc1
      - ca-certificates
    # A Secret Service keyring for the engine's secrets; servers use `--key-file` instead.
    suggests:
      - gnome-keyring
  rpm:
    depends:
      - glibc >= 2.31
      # The soname, not a package: libgcc on Fedora and RHEL, libgcc_s1 on openSUSE.
      - libgcc_s.so.1()(64bit)
      - ca-certificates

rpm:
  group: Applications/Internet
  summary: Airpost mail engine, command-line client, MCP server and web gateway
