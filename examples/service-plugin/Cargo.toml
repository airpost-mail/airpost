[package]
name = "airpost-sample-service"
description = "Sample Airpost service plugin: acts on its plugin's due metadata from the engine socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "airpost-sample-service"
path = "src/main.rs"

# A service plugin is a separate program on the engine socket;
# airpost-client is the supported way to find and talk to the engine.
[dependencies]
airpost-ipc.workspace = true
airpost-client.workspace = true
serde_json.workspace = true
