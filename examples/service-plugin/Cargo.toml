[package]
name = "tern-sample-service"
description = "Sample Tern service plugin: acts on its plugin's due metadata from the engine socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "tern-sample-service"
path = "src/main.rs"

# A service plugin is a separate program on the engine socket;
# tern-client is the supported way to find and talk to the engine.
[dependencies]
tern-ipc.workspace = true
tern-client.workspace = true
serde_json.workspace = true
