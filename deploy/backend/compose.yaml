# Airpost backend behind Caddy, for one host with a DNS name (https://docs.airpost.sh/self-hosting/server).
#   cp .env.example .env    # set AIRPOST_DOMAIN and AIRPOST_VERSION
#   docker compose up -d
#   docker compose exec backend airpost-backend user add you@example.com
# Caddy gets the certificate. The backend is reachable only through it.
name: airpost

services:
  backend:
    image: ghcr.io/airpost/airpost-backend:${AIRPOST_VERSION:?set AIRPOST_VERSION in .env}
    restart: unless-stopped
    environment:
      AIRPOST_PUBLIC_URL: https://${AIRPOST_DOMAIN:?set AIRPOST_DOMAIN in .env}
      AIRPOST_SIGNUP: ${AIRPOST_SIGNUP:-closed}
      # Only Caddy shares this network and no port is published, so every peer on the subnet
      # is the proxy (or the host through a published port, see compose.own-proxy.yaml).
      AIRPOST_TRUSTED_PROXIES: ${AIRPOST_SUBNET:-172.31.85.0/24}
      AIRPOST_BACKUP_DIR: /backups
      AIRPOST_BACKUP_INTERVAL: ${AIRPOST_BACKUP_INTERVAL:-24h}
      AIRPOST_BACKUP_KEEP: ${AIRPOST_BACKUP_KEEP:-14}
      AIRPOST_LOG_FORMAT: ${AIRPOST_LOG_FORMAT:-text}
    volumes:
      - data:/data
      - backups:/backups
    tmpfs:
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/airpost-backend", "healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks: [airpost]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${AIRPOST_HTTP_PORT:-80}:80"
      - "${AIRPOST_HTTPS_PORT:-443}:443"
      - "${AIRPOST_HTTPS_PORT:-443}:443/udp"
    environment:
      AIRPOST_DOMAIN: ${AIRPOST_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks: [airpost]

volumes:
  data:
  backups:
  caddy-data:
  caddy-config:

networks:
  airpost:
    ipam:
      config:
        - subnet: ${AIRPOST_SUBNET:-172.31.85.0/24}
