# Airpost server: the engine headless, and next to it the web client, the backend and MCP over
# HTTP, each a service of its own from the one airpost-server image (https://docs.airpost.sh/self-hosting/server).
#   cp .env.example .env    # AIRPOST_DOMAIN, AIRPOST_VERSION, COMPOSE_PROFILES
#   docker compose up -d
#   docker compose exec engine airpost account add you@example.com
#   docker compose exec gateway airpost-gateway pair --admin
# The engine always runs. COMPOSE_PROFILES turns the rest on: web (airpost-gateway and the web
# client), proxy (Caddy, TLS for AIRPOST_DOMAIN), backend (airpost-backend), mcp (airpost-mcp http).
# Docker restarts what stops; there is no supervisor process.
#
# The profile volume holds the engine's database, settings, logs and socket, and the gateway's
# and airpost-mcp's state; every component that talks to the engine mounts it, as the same user.
# The engine-key volume holds the key that encrypts the account passwords and tokens in the
# profile (secrets.enc); only the engine mounts it.
name: airpost-server

x-airpost: &airpost
  image: ${AIRPOST_IMAGE:-ghcr.io/airpost/airpost-server}:${AIRPOST_VERSION:?set AIRPOST_VERSION in .env}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  networks: [airpost]

services:
  engine:
    <<: *airpost
    command: ["/usr/local/bin/airpost-engine", "--mode", "serve", "--detached"]
    environment:
      # Your own OAuth clients for Gmail and Microsoft 365; empty uses the built-in ones.
      AIRPOST_GMAIL_CLIENT_ID: ${AIRPOST_GMAIL_CLIENT_ID:-}
      AIRPOST_GMAIL_CLIENT_SECRET: ${AIRPOST_GMAIL_CLIENT_SECRET:-}
      AIRPOST_O365_CLIENT_ID: ${AIRPOST_O365_CLIENT_ID:-}
    volumes:
      - profile:/profile
      - engine-key:/keys
    # `airpost status` exits 3 when no engine answers on the profile's socket.
    healthcheck:
      test: ["CMD", "/usr/local/bin/airpost", "status"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    stop_grace_period: 30s

  gateway:
    <<: *airpost
    profiles: [web]
    command: ["/usr/local/bin/airpost-gateway", "serve"]
    depends_on:
      engine:
        condition: service_healthy
    environment:
      AIRPOST_GATEWAY_PUBLIC_URL: ${AIRPOST_PUBLIC_URL:-https://${AIRPOST_DOMAIN:?set AIRPOST_DOMAIN in .env}}
      # Caddy, or the host's proxy through a published port (compose.own-proxy.yaml).
      AIRPOST_TRUSTED_PROXIES: ${AIRPOST_SUBNET:-172.31.86.0/24}
    volumes:
      - profile:/profile
    healthcheck:
      test: ["CMD", "/usr/local/bin/airpost-gateway", "healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  backend:
    <<: *airpost
    profiles: [backend]
    command: ["/usr/local/bin/airpost-backend", "serve"]
    environment:
      AIRPOST_PUBLIC_URL: ${AIRPOST_PUBLIC_URL:-https://${AIRPOST_DOMAIN:?set AIRPOST_DOMAIN in .env}}
      AIRPOST_SIGNUP: ${AIRPOST_SIGNUP:-closed}
      AIRPOST_TRUSTED_PROXIES: ${AIRPOST_SUBNET:-172.31.86.0/24}
      AIRPOST_BACKUP_DIR: /backups
      AIRPOST_BACKUP_INTERVAL: ${AIRPOST_BACKUP_INTERVAL:-24h}
      AIRPOST_BACKUP_KEEP: ${AIRPOST_BACKUP_KEEP:-14}
      AIRPOST_LOG_FORMAT: ${AIRPOST_LOG_FORMAT:-text}
    volumes:
      - backend-data:/data
      - backend-backups:/backups
    healthcheck:
      test: ["CMD", "/usr/local/bin/airpost-backend", "healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  mcp:
    <<: *airpost
    profiles: [mcp]
    command: ["/usr/local/bin/airpost-mcp", "http", "--bind", "0.0.0.0"]
    depends_on:
      engine:
        condition: service_healthy
    environment:
      # Read-only from this directory, so the policy is the operator's (https://docs.airpost.sh/agents/access-levels).
      AIRPOST_MCP_POLICY: /etc/airpost/mcp.json
      AIRPOST_MCP_ALLOWED_HOSTS: ${AIRPOST_DOMAIN:?set AIRPOST_DOMAIN in .env}
    volumes:
      - profile:/profile
      - ./mcp.json:/etc/airpost/mcp.json:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/airpost-mcp", "healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  caddy:
    image: caddy:2
    profiles: [proxy]
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
        required: false
      backend:
        condition: service_healthy
        required: false
      mcp:
        condition: service_healthy
        required: false
    ports:
      - "${AIRPOST_HTTP_PORT:-80}:80"
      - "${AIRPOST_HTTPS_PORT:-443}:443"
      - "${AIRPOST_HTTPS_PORT:-443}:443/udp"
    environment:
      AIRPOST_DOMAIN: ${AIRPOST_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks: [airpost]

volumes:
  profile:
  engine-key:
  backend-data:
  backend-backups:
  caddy-data:
  caddy-config:

networks:
  airpost:
    ipam:
      config:
        - subnet: ${AIRPOST_SUBNET:-172.31.86.0/24}
