# Builds the airpost-server image from this checkout instead of pulling it, for development and CI.
#   AIRPOST_VERSION=dev docker compose -f compose.yaml -f compose.build.yaml up -d --build
# The engine's service builds the image; the others run the same tag.
services:
  engine:
    image: airpost-server:${AIRPOST_VERSION:-dev}
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
  gateway:
    image: airpost-server:${AIRPOST_VERSION:-dev}
  backend:
    image: airpost-server:${AIRPOST_VERSION:-dev}
  mcp:
    image: airpost-server:${AIRPOST_VERSION:-dev}
